<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로우폴리 포뮬러 테스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Playfair+Display:wght@700&family=Saira+Extra+Condensed:ital,wght@1,800&display=swap">
<style>
  /* 레이아웃: 3D 화면 위에 구간 환영 문구, 우측 상단 미니 플레이어, 곡 선택 창을 얹는다. */
  :root {
    color-scheme: dark;
    --ground: #5f9a4a;
    --ink: #191b18;
    --panel: rgba(22, 24, 20, .8);
    --line: rgba(255, 255, 255, .28);
    --text: #ffffff;
    --muted: #cfd4c8;
      --signal: #ffc531;
    --glow: #fa243c;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-gauge: "Saira Extra Condensed", "Arial Narrow", sans-serif;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--text); font-family: var(--font-body); }

  .hud { position: fixed; z-index: 10; pointer-events: none; }
  #zone {
    top: 25%; left: 50%; transform: translate(-50%, 12px);
    font: 700 clamp(24px, 5.4vw, 68px)/1.1 "Playfair Display", Georgia, "Times New Roman", serif;
    color: #ffffff; text-shadow: 0 2px 20px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .45); white-space: nowrap;
    opacity: 0; transition: opacity .7s, transform .7s;
  }
  #zone.show { opacity: 1; transform: translate(-50%, 0); }
  #zone.ink { color: var(--glow); text-shadow: none; }
  #zone.glitch { color: #00c853; text-shadow: none; }
  [hidden] { display: none !important; }
  #fuelTag { left: 0; top: 0; z-index: 9; will-change: transform; }
  #fuelPrompt {
    pointer-events: auto; cursor: pointer; padding: 7px 12px; border: 0; border-radius: 4px;
    background: var(--signal); color: var(--ink); font: 600 14px var(--font-body); white-space: nowrap;
  }
  @media (hover: hover) and (pointer: fine) { #consoleExit, #pickerClose { display: none; } }
  #fuelPrompt.waiting { background: var(--panel); color: var(--text); }
  #fuelPanel { display: grid; gap: 6px; width: 156px; padding: 10px 12px; background: var(--panel); border-radius: 6px; }
  #fuelHead { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #fuelBar { height: 8px; overflow: hidden; border-radius: 2px; background: var(--line); }
  #fuelFill { width: 0; height: 100%; background: var(--signal); }
  #pad.locked { opacity: .4; }
  #consolePanel {
    left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    display: grid; grid-template-columns: repeat(3, 76px); gap: 8px; padding: 12px;
    background: var(--panel); border-radius: 6px; font-variant-numeric: tabular-nums;
  }
  .band { display: grid; gap: 2px; padding: 6px 8px; border-radius: 4px; }
  .band span { font-size: 12px; color: var(--muted); }
  .band strong { font: italic 800 26px/1 var(--font-gauge); }
  .band.on { background: var(--glow); }
  .band.on span { color: #fff; }
  #consoleExit {
    grid-column: 1 / 4; pointer-events: auto; cursor: pointer; padding: 7px 8px; border: 0; border-radius: 4px;
    background: var(--signal); color: var(--ink); font: 600 13px var(--font-body); white-space: nowrap;
  }
  #pad {
    display: none;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    gap: 6px;
    grid-template-columns: 46px 46px 46px 10px 96px;
    grid-template-rows: 46px 46px;
    grid-template-areas: ". w . . shift" "a s d . space";
  }
  .key {
    pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
    display: grid; place-items: center; padding: 0; cursor: pointer;
    border: 1px solid var(--line); border-radius: 5px;
    background: var(--panel); color: var(--text);
    font: 600 14px var(--font-body);
  }
  .key small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
  .key.on { background: var(--signal); border-color: var(--signal); color: var(--ink); }
  .key.on small { color: var(--ink); }
  [data-input="forward"] { grid-area: w; } [data-input="left"] { grid-area: a; }
  [data-input="back"] { grid-area: s; } [data-input="right"] { grid-area: d; }
  [data-input="boost"] { grid-area: shift; } [data-input="brake"] { grid-area: space; }

  /* 시작 화면: 트랙 위의 빛나는 원 안쪽만 보여 주고, 아무 키나 누르면 원이 맵 전체로 퍼집니다. */
  body.lab, body.lab canvas { cursor: none; }
  #labInput { position: fixed; left: -400px; top: 50%; width: 300px; height: 40px; opacity: 0; pointer-events: none; }
  #iris { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none; background: #09090b; }
  #title {
    z-index: 31; left: 50%; bottom: 10%; transform: translateX(-50%); color: #ffffff; white-space: nowrap;
    font: 700 clamp(24px, 4.4vw, 54px)/1.1 "Playfair Display", Georgia, "Times New Roman", serif;
    animation: titlePulse 2.2s ease-in-out infinite;
  }
  @keyframes titlePulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { #title { animation: none; } }

  /* 미니 플레이어: 처음 음악을 고른 뒤로 계속 우측 상단에 남습니다. */
  #mini {
    top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    width: min(292px, calc(100vw - 32px)); box-sizing: border-box; display: grid; gap: 10px; padding: 12px;
    background: rgba(20, 20, 24, .88); border-radius: 12px; pointer-events: auto;
  }
  #miniTop { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; min-width: 0; }
  #miniCover { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; display: block; }
  #miniInfo { min-width: 0; display: grid; gap: 2px; }
  #miniTitle, #miniArtist { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #miniTitle { font-size: 14px; font-weight: 600; }
  #miniArtist { min-height: 16px; font-size: 12px; color: #b9bbc4; }
  #miniBar { height: 3px; overflow: hidden; border-radius: 2px; background: rgba(255, 255, 255, .22); }
  #miniFill { width: 0; height: 100%; background: var(--glow); }
  #miniControls { display: grid; grid-template-columns: repeat(3, 34px) 18px 1fr; gap: 4px; align-items: center; }
  .miniButton {
    display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%;
    background: transparent; color: #ffffff; cursor: pointer;
  }
  .miniButton:hover { background: rgba(255, 255, 255, .14); }
  .miniButton svg { width: 18px; height: 18px; fill: currentColor; display: block; }
  #miniToggle { background: var(--glow); }
  #miniToggle:hover { background: #ff4a5e; }
  #mini.locked .miniButton { opacity: .3; pointer-events: none; }
  #mini.locked #miniCover { visibility: hidden; }
  #miniIcon { width: 16px; height: 16px; fill: #b9bbc4; margin-left: 4px; }
  #miniVolume { width: 100%; min-width: 0; margin: 0; accent-color: var(--glow); cursor: pointer; }

  /* 곡 선택 창: LP 플레이어 앞에서 엽니다. */
  #picker {
    left: 50%; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    width: min(540px, calc(100vw - 32px)); box-sizing: border-box; display: grid; gap: 10px; padding: 14px;
    background: rgba(20, 20, 24, .92); border-radius: 12px; pointer-events: auto;
  }
  #pickerList { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pickerSong {
    position: relative; display: grid; gap: 6px; min-width: 0; padding: 8px; border: 2px solid transparent; border-radius: 10px;
    background: rgba(255, 255, 255, .06); color: #ffffff; font: inherit; text-align: left; cursor: pointer;
  }
  .pickerSong.on { border-color: var(--glow); background: rgba(250, 36, 60, .16); }
  .pickerSong img { width: 100%; aspect-ratio: 1; border-radius: 6px; object-fit: cover; display: block; }
  .pickerSong strong, .pickerSong span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .pickerSong strong { font-size: 14px; font-weight: 600; }
  .pickerSong span { min-height: 15px; font-size: 11px; color: #b9bbc4; }
  .pickerSong.playing::after { content: ""; position: absolute; top: 15px; right: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 0 3px #ffffff; }
  #pickerClose { justify-self: end; padding: 7px 14px; border: 0; border-radius: 6px; background: var(--glow); color: #ffffff; font: 600 13px var(--font-body); cursor: pointer; }

  @media (pointer: coarse) {
    #pad {
      display: grid;
      right: max(16px, env(safe-area-inset-right, 0px));
      grid-template-columns: 64px 64px 1fr 72px 64px;
      grid-template-rows: 58px 58px;
      grid-template-areas: ". . . shift w" "a d . space s";
    }
    #consolePanel, #picker { bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.7.1/dist/aframe-master.min.js"></script>

/* ---------- 입력: e.code를 사용해 한글 입력 상태에서도 WASD가 동작합니다 ---------- */
const input = { forward: false, back: false, left: false, right: false, boost: false, brake: false };
const KEYS = {
  KeyW: 'forward', ArrowUp: 'forward', KeyS: 'back', ArrowDown: 'back',
  KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
  ShiftLeft: 'boost', ShiftRight: 'boost', Space: 'brake'
};
function setInput(name, value) {
  input[name] = value;
  const key = document.querySelector('.key[data-input="' + name + '"]');
  if (key) key.classList.toggle('on', value);
}
function beginDriving() {
  AUDIO.ensure();
  BGM.start();
  window.focus();
}
// 시작 연출: 대기 화면 → 아무 키나 누르면 트랙 위의 원이 맵 전체로 퍼지며 바로 출발
const INTRO = {
  state: 'title', reveal: -1, centerX: 0, centerZ: 0,

  begin: function () {
    if (this.state !== 'title') return;
    this.state = 'done';
    this.reveal = 0;
    WORLD.locked = false;
    beginDriving();
    document.getElementById('title').hidden = true;
  },
  // R: 처음의 대기 화면으로 돌아갑니다.
  restart: function () {
    this.state = 'title';
    this.reveal = -1;
    WORLD.locked = true;
    Object.keys(input).forEach(function (name) { setInput(name, false); });
    document.getElementById('title').hidden = false;
    document.getElementById('iris').hidden = false;
  },
  // 대기 화면에서 W를 누르면 시작과 동시에 바로 달립니다.
  key: function (e) {
    if (this.state === 'done') return false;
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey || /^F\d+$/.test(e.key)) return true;
    this.begin();
    return !KEYS[e.code];
  },
  // 트랙 위의 원을 화면 좌표로 옮겨, 그 바깥을 검게 칠하고 원 둘레에 흰빛을 그립니다.
  draw: function (camera, radius, ring, track) {
    const canvas = document.getElementById('iris'), ctx = canvas.getContext('2d');
    const ratio = Math.min(window.devicePixelRatio || 1, 2), w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * ratio)) canvas.width = Math.round(w * ratio);
    if (canvas.height !== Math.round(h * ratio)) canvas.height = Math.round(h * ratio);
    canvas.style.background = 'transparent';
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#09090b';
    ctx.fillRect(0, 0, w, h);
    const center = new THREE.Vector3(this.centerX, 0.05, this.centerZ).applyMatrix4(camera.matrixWorldInverse), point = new THREE.Vector3();
    // Void에서 빠져나올 때는 원 밖에 흰 트랙을 함께 그립니다.
    if (track) {
      const eye = camera.getWorldPosition(new THREE.Vector3()), half = 7, corners = [[-half, 0], [half, 0], [half, 1], [-half, 1]];
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      track.forEach(function (spot, index) {
        const next = track[(index + 1) % track.length];
        if (Math.hypot(spot.point.x - eye.x, spot.point.z - eye.z) > 110) return;
        let behind = false;
        const quad = corners.map(function (corner) {
          const from = corner[1] ? next : spot;
          point.set(from.point.x + from.normal.x * corner[0], 0.03, from.point.z + from.normal.z * corner[0]).applyMatrix4(camera.matrixWorldInverse);
          if (point.z > -1) behind = true;
          point.applyMatrix4(camera.projectionMatrix);
          return [(point.x + 1) / 2 * w, (1 - point.y) / 2 * h];
        });
        if (behind) return;
        ctx.moveTo(quad[0][0], quad[0][1]);
        for (let k = 1; k < 4; k++) ctx.lineTo(quad[k][0], quad[k][1]);
        ctx.closePath();
      });
      ctx.fill();
    }
    ctx.beginPath();
    for (let i = 0; i < 96; i++) {
      const angle = i / 96 * Math.PI * 2;
      point.set(this.centerX + Math.cos(angle) * radius, 0.05, this.centerZ + Math.sin(angle) * radius).applyMatrix4(camera.matrixWorldInverse);
      // 원이 커져 카메라 뒤로 넘어가는 점은 카메라 바로 앞으로 당깁니다.
      if (point.z > -2) point.lerpVectors(center, point, (-2 - center.z) / (point.z - center.z));
      point.applyMatrix4(camera.projectionMatrix);
      ctx.lineTo((point.x + 1) / 2 * w, (1 - point.y) / 2 * h);
    }
    ctx.closePath();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = ring || '#ffffff';
    ctx.lineJoin = 'round';
    ctx.shadowColor = ring || '#ffffff';
    [[34, 5], [16, 4], [6, 3]].forEach(function (pass) {
      ctx.shadowBlur = pass[0];
      ctx.lineWidth = pass[1];
      ctx.stroke();
    });
    ctx.shadowBlur = 0;
  },
  // Void에 들어오는 순간 화면을 덮는 초록 조각. amount가 줄어들수록 조각이 사라집니다.
  scatter: function (amount) {
    const canvas = document.getElementById('iris'), ctx = canvas.getContext('2d'), greens = CONFIG.void.greens;
    const ratio = Math.min(window.devicePixelRatio || 1, 2), w = canvas.clientWidth, h = canvas.clientHeight, cell = Math.max(w, h) / 24;
    canvas.width = Math.round(w * ratio);
    canvas.height = Math.round(h * ratio);
    canvas.style.background = 'transparent';
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, w, h);
    for (let x = 0; x < w; x += cell) {
      for (let y = 0; y < h; y += cell) {
        if (Math.random() > amount * 0.8) continue;
        ctx.fillStyle = greens[Math.floor(Math.random() * greens.length)];
        ctx.globalAlpha = 0.3 + Math.random() * 0.7;
        ctx.fillRect(x, y, cell * (1 + Math.floor(Math.random() * 2)), cell);
      }
    }
    ctx.globalAlpha = 1;
  },
  // 화면 네 모서리가 닿는 땅까지의 거리: 원이 이만큼 커지면 맵 전체가 보입니다.
  reach: function (camera) {
    const self = this, eye = camera.getWorldPosition(new THREE.Vector3()), corner = new THREE.Vector3();
    let far = 0;
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (c) {
      corner.set(c[0], c[1], 0.5).unproject(camera).sub(eye);
      const t = corner.y < -0.001 ? -eye.y / corner.y : 400;
      far = Math.max(far, Math.hypot(eye.x + corner.x * t - self.centerX, eye.z + corner.z * t - self.centerZ));
    });
    return far * 1.12;
  },
  update: function (dt, x, z, car) {
    const c = CONFIG.start;
    if (this.reveal >= 1) return;
    const camera = car.el.sceneEl.camera;
    if (!camera) return;
    car.cameraEl.object3D.updateMatrixWorld(true);
    let radius = c.circle;
    if (this.reveal < 0) {
      this.centerX = x;
      this.centerZ = z;
    } else {
      const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      this.reveal = calm ? 1 : Math.min(1, this.reveal + dt / c.irisSeconds);
      radius += (this.reach(camera) - radius) * this.reveal * this.reveal;
      if (this.reveal >= 1) { document.getElementById('iris').hidden = true; return; }
    }
    this.draw(camera, radius);
  }
};
window.addEventListener('keydown', function (e) {
  const name = KEYS[e.code];
  if (LAB.active) {
    LAB.key(e, true);
    return;
  }
  if (name) e.preventDefault();
  if (INTRO.key(e)) return;
  if (WORLD.player.open) {
    pickerKey(e);
    return;
  }
  if (WORLD.console.active) {
    if (name) consoleInput(name, true);
    if ((e.code === 'KeyF' || e.code === 'Escape') && !e.repeat) exitConsole();
    return;
  }
  if (WORLD.locked) return;   // 주유 중에는 모든 조작 키를 막습니다.
  if (name) { setInput(name, true); beginDriving(); }
  if (e.code === 'KeyF' && !e.repeat) {
    e.preventDefault();   // 메모장 입력칸에 f가 들어가지 않게 합니다.
    beginDriving();
    WORLD.startFuel();
  }
  if (e.code === 'KeyR' && !e.repeat) {
    WORLD.reset();
    INTRO.restart();
  }
});
// 마우스 휠: 위로 굴리면 가까이, 아래로 굴리면 멀리 봅니다.
window.addEventListener('wheel', function (e) {
  e.preventDefault();
  const amount = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  if (LAB.active) {
    LAB.wheelAngle += amount * 0.006;
    return;
  }
  WORLD.viewZoom = THREE.MathUtils.clamp(WORLD.viewZoom * Math.exp(amount * 0.0012), CONFIG.camera.minZoom, CONFIG.camera.maxZoom);

/* ---------- 도형 도우미 ---------- */
function inFaust(x, z) {
  const f = CONFIG.faust;
  return x < f.edgeX + Math.sin(z * 0.07) * 7 && z > f.edgeZ + Math.sin(x * 0.06) * 6;
}
function inMusic(x, z) {
  const m = CONFIG.music;
  return !inFaust(x, z) && z < m.edgeZ + Math.sin(x * 0.05) * 2 && x < m.edgeX + Math.sin(z * 0.06) * 5;
}
function inFashion(x, z) {
  return !inFaust(x, z) && !inMusic(x, z) && x >= CONFIG.music.edgeX + Math.sin(z * 0.06) * 5 && z < CONFIG.fashion.edgeZ + Math.sin(x * 0.05) * 3;
}
function inLab(x, z) {
  return !inFaust(x, z) && !inMusic(x, z) && !inFashion(x, z) && x >= CONFIG.lab.edgeX && z > CONFIG.lab.edgeZ;
}
function zoneAt(x, z) {
  return inFaust(x, z) ? 'faust' : inMusic(x, z) ? 'music' : inFashion(x, z) ? 'fashion' : null;
}
function makeMaterial(color, extra) {
  return new THREE.MeshStandardMaterial(Object.assign({ color: color, roughness: 0.72, metalness: 0, flatShading: true }, extra));
}
function addMesh(geometry, material, parent, x, y, z) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x || 0, y || 0, z || 0);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function addBox(w, h, d, material, parent, x, y, z) {
  return addMesh(new THREE.BoxGeometry(w, h, d), material, parent, x, y, z);
}
// 두 점을 잇는 가는 막대. 서스펜션 암과 페어링 지지대에 사용합니다.
function addStrut(a, b, thickness, material, parent) {
  const from = new THREE.Vector3().fromArray(a), to = new THREE.Vector3().fromArray(b);
  const mesh = addBox(thickness, thickness * 0.6, from.distanceTo(to), material, parent);
  mesh.position.copy(from).add(to).multiplyScalar(0.5);
  mesh.lookAt(parent.localToWorld(to.clone()));
  return mesh;
}
// z축을 따라 단면을 이어 붙여 각진 차체를 만듭니다. 단면은 앞(-z)에서 뒤(+z) 순서입니다.
function loft(sections, sides) {
  const rings = sections.map(function (s) {
    const ring = [];
    for (let i = 0; i < sides; i++) {
      const angle = (i + 0.5) / sides * Math.PI * 2;
      ring.push([(s.x || 0) + Math.cos(angle) * s.w / 2, s.y + Math.sin(angle) * s.h / 2, s.z]);
    }
    return ring;
  });
  const positions = [];
  const tri = function (a, b, c) { positions.push.apply(positions, a.concat(b, c)); };
  for (let s = 0; s < rings.length - 1; s++) {
    for (let i = 0; i < sides; i++) {
      const n = (i + 1) % sides;
      const a = rings[s][i], b = rings[s][n], c = rings[s + 1][n], d = rings[s + 1][i];
      tri(a, b, d); tri(b, c, d);
    }
  }
  const first = sections[0], last = sections[sections.length - 1];
  const front = [first.x || 0, first.y, first.z], back = [last.x || 0, last.y, last.z];
  for (let i = 0; i < sides; i++) {
    const n = (i + 1) % sides;
    tri(front, rings[0][n], rings[0][i]);
    tri(back, rings[rings.length - 1][i], rings[rings.length - 1][n]);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.computeVertexNormals();
  return geometry;
}

  // 도로 차량 공통 부품: 바퀴, 브레이크등, 배기 불꽃을 만들고 차종 정보를 등록합니다.
  finishRoadCar: function (name, parts) {
    const c = CONFIG.color;
    const steerGroups = [], spinGroups = [];
    const tyre = makeMaterial(c.tyre, { roughness: 0.9 }), rim = makeMaterial(parts.rim, { roughness: 0.3 }), hub = makeMaterial(parts.hub);
    parts.wheels.forEach(function (w, index) {
      const steer = new THREE.Group();
      steer.position.set(w[0], parts.radius, w[1]);
      parts.root.add(steer);
      const spin = new THREE.Group();
      steer.add(spin);
      const tyreGeo = new THREE.CylinderGeometry(parts.radius, parts.radius, parts.width, 14);
      tyreGeo.rotateZ(Math.PI / 2);
      addMesh(tyreGeo, tyre, spin);
      const rimGeo = new THREE.CylinderGeometry(parts.radius * 0.7, parts.radius * 0.7, parts.width + 0.02, 14);
      rimGeo.rotateZ(Math.PI / 2);
      addMesh(rimGeo, hub, spin);
      [0, 1, 2, 3, 4].forEach(function (k) {
        addBox(parts.width + 0.05, 0.05, parts.radius * 1.3, rim, spin).rotation.x = k * Math.PI / 5;
      });
      if (index < 2) steerGroups.push(steer);
      spinGroups.push(spin);
    });
    const flameGeometry = new THREE.ConeGeometry(0.09, 0.8, 7);
    flameGeometry.translate(0, 0.4, 0);
    flameGeometry.rotateX(Math.PI / 2);
    const flameMaterial = new THREE.MeshBasicMaterial({ color: '#ffb12a' });
    const flames = parts.exhausts.map(function (spot) {
      const flame = new THREE.Mesh(flameGeometry, flameMaterial);
      flame.position.set(spot[0], spot[1], spot[2]);
      flame.visible = false;
      parts.body.add(flame);
      return flame;
    });
    parts.root.visible = false;
    this.cars[name] = {
      root: parts.root, body: parts.body, brakeLight: parts.brakeLight, flames: flames, steerGroups: steerGroups, spinGroups: spinGroups,
      spec: Object.assign({ car: CONFIG.roadCars[name].car, suspension: CONFIG.roadCars[name].suspension }, parts.spec)
    };
  },

  // 흑백 오프로더: 곧게 선 앞유리와 각진 차체, 둥근 램프, 검은 펜더, 뒤쪽 스페어타이어

      [-1.45, 1.45].forEach(function (z) {

  // 글리치 구간의 차량 잔상: 흑백 포뮬러의 모든 부품을 한 덩어리로 합쳐 여러 개를 띄웁니다.
  buildGhosts: function () {
    const car = this.cars.mono, positions = [], point = new THREE.Vector3();
    car.root.visible = true;
    car.root.updateMatrixWorld(true);
    const inverse = car.root.matrixWorld.clone().invert(), relative = new THREE.Matrix4();
    car.root.traverseVisible(function (mesh) {
      if (!mesh.isMesh) return;
      const shape = mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry, from = shape.attributes.position;
      relative.multiplyMatrices(inverse, mesh.matrixWorld);
      for (let i = 0; i < from.count; i++) {
        point.fromBufferAttribute(from, i).applyMatrix4(relative);
        positions.push(point.x, point.y, point.z);
      }
    });
    car.root.visible = this.carName === 'mono';
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    this.ghosts = [];
    for (let i = 0; i < CONFIG.void.ghosts; i++) {
      const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: CONFIG.void.greens[0], transparent: true, opacity: 0.4, depthWrite: false, fog: false, toneMapped: false, side: THREE.DoubleSide }));
      mesh.visible = false;
      mesh.frustumCulled = false;
      this.el.sceneEl.object3D.add(mesh);   // 차를 따라다니지 않도록 맵에 직접 놓습니다.
      this.ghosts.push({ mesh: mesh, life: 0, total: 1, opacity: 0.5, vx: 0, vz: 0 });
    }
  },

    addBox(1.1, 0.03, 0.05, white, gait, 0, 2.79, -0.66);

    addMesh(loft([{ z: -0.48, w: 0.62, h: 0.26, y: 2.9 }, { z: -0.1, w: 0.76, h: 0.16, y: 2.84 }, { z: 0.3, w: 0.72, h: 0.3, y: 2.92 }], 6), leather, gait);
    addMesh(new THREE.CylinderGeometry(0.08, 0.06, 0.26, 6), leather, gait, 0, 3.08, -0.5);
    const rider = makePerson({ top: c.jacket, sleeve: c.jacket, pants: c.jeans, shoe: c.boot, skin: c.skin, hair: c.hair, inner: c.stitch, legs: [0.72, 0.72] });

  // 스트릿: 후드집업과 블랙 플레어 데님을 입은 스케이터. 가속할 때 뒷발로 땅을 밉니다.
  buildSkater: function () {
    const c = CONFIG.rides.skater.color, root = new THREE.Group(), body = new THREE.Group();
    this.el.object3D.add(root);
    root.add(body);
    const deck = makeMaterial(c.deck), grip = makeMaterial(c.grip), truck = makeMaterial(c.truck), wheelMat = makeMaterial(c.wheel);
    addBox(0.82, 0.08, 2, deck, body, 0, 0.36, 0);
    addBox(0.8, 0.02, 2, grip, body, 0, 0.41, 0);
    [-1, 1].forEach(function (side) {
      const kick = addBox(0.74, 0.08, 0.5, deck, body, 0, 0.44, side * 1.17);
      kick.rotation.x = -side * 0.34;
      const tape = addBox(0.72, 0.02, 0.48, grip, body, 0, 0.49, side * 1.16);
      tape.rotation.x = -side * 0.34;
    });
    const steerGroups = [], spinGroups = [];
    [-0.72, 0.72].forEach(function (z, index) {
      const axle = new THREE.Group();
      axle.position.set(0, 0.17, z);
      body.add(axle);
      addBox(0.9, 0.07, 0.1, truck, axle, 0, 0.02, 0);
      addBox(0.2, 0.14, 0.2, truck, axle, 0, 0.1, 0);
      [-1, 1].forEach(function (side) {
        const spin = new THREE.Group();
        spin.position.set(side * 0.47, 0, 0);
        axle.add(spin);
        const wheel = new THREE.CylinderGeometry(0.17, 0.17, 0.16, 10);
        wheel.rotateZ(Math.PI / 2);
        addMesh(wheel, wheelMat, spin);
        addBox(0.18, 0.05, 0.3, truck, spin);
        spinGroups.push(spin);
      });

    });

    const hipY = 1.5, deckY = 0.42 - hipY + 0.1;
    person.group.position.set(0, hipY, 0.06);
    person.group.rotation.y = -Math.PI / 2;
    body.add(person.group);
    // 후드, 지퍼, 비니
    const hood = makeMaterial(c.hoodieDark);
    addBox(0.78, 0.46, 0.34, hood, person.torso, 0, 1.2, 0.3);
    addBox(0.05, 0.8, 0.02, makeMaterial(c.zip), person.torso, 0, 0.74, -0.285);
    addBox(0.6, 0.18, 0.04, hood, person.torso, 0, 0.42, -0.28);
    addBox(0.52, 0.2, 0.52, makeMaterial(c.beanie), person.head, 0, 0.3, 0);
    person.head.rotation.y = Math.PI / 2 * 0.86;
    person.torso.rotation.y = 0.5;
    const [up, low] = [0.8, 0.8];
    let push = 0, cycle = 0;
    this.addRide('skater', {
      root: root, body: body, steerGroups: steerGroups, spinGroups: spinGroups,
      spec: { skidWidth: 0.42, frontAxle: 0.9, noseLength: 1.4, tailLength: 1.4, halfWidth: 0.2 },
      animate: function (dt, s) {

        const pushing = input.forward && !input.back && !input.brake && speed < top * 0.95;

        cycle += dt * (s.boosting ? 8.4 : 5.6);

        const footX = 0.52 + (0.42 + sweep * 0.56) * push, footY = deckY + (-1.42 + lift + 0.1 - deckY) * push;
        reachSide(person.legs[0], -0.24, -0.5, deckY, up, low);
        reachSide(person.legs[1], 0.24, footX, footY, up, low);
        person.legs[1].top.rotation.x = -0.3 * push;
        person.group.position.y = hipY - push * (0.1 + Math.abs(sweep) * 0.06);
        person.torso.rotation.z = 0.14 + push * 0.2 + Math.min(speed / top, 1) * 0.08;
        person.arms[0].top.rotation.set(0, 0, -0.95 + sweep * 0.34 * push);
        person.arms[1].top.rotation.set(0, 0, 0.95 + sweep * 0.34 * push);
        person.arms[0].low.rotation.x = 0.32;
        person.arms[1].low.rotation.x = 0.32;
      }
    });
  },

  // 캐주얼: 클래식 자전거와 흰 셔츠, 넥타이, 베이지 코튼 팬츠 차림의 라이더. 다리는 페달을 따라 움직입니다.
  buildBike: function () {
    const c = CONFIG.rides.bike.color, root = new THREE.Group(), body = new THREE.Group();
    this.el.object3D.add(root);
    root.add(body);
    const frame = makeMaterial(c.frame, { roughness: 0.3, metalness: 0.2 }), chrome = makeMaterial(c.chrome, { roughness: 0.25, metalness: 0.5 });
    const tyre = makeMaterial(c.tyre, { roughness: 0.9 }), leather = makeMaterial(c.leather), fender = makeMaterial(c.frame, { roughness: 0.3, side: THREE.DoubleSide });
    const R = 0.86, axleRear = [0, R, 1.02], bb = [0, 0.86, 0.12], seat = [0, 2.02, 0.56], headTop = [0, 2.02, -0.72], headLow = [0, 1.7, -0.82];
    const tube = function (a, b, r, material, parent) { return addMesh(tubeBetween(a, b, r), material || frame, parent || body); };
    tube(bb, seat, 0.055);
    tube(seat, headTop, 0.05);
    tube(headLow, bb, 0.055);
    tube(headTop, headLow, 0.07);
    [-0.1, 0.1].forEach(function (x) {
      tube([x * 0.4, bb[1], bb[2]], [x, axleRear[1], axleRear[2]], 0.03);
      tube([x * 0.4, seat[1] - 0.06, seat[2] - 0.02], [x, axleRear[1], axleRear[2]], 0.03);
    });
    const wheel = function (parent, z) {
      const spin = new THREE.Group();
      spin.position.set(0, R, z);
      parent.add(spin);
      const rim = new THREE.TorusGeometry(R - 0.04, 0.045, 6, 22);
      rim.rotateY(Math.PI / 2);
      addMesh(rim, tyre, spin);
      const inner = new THREE.TorusGeometry(R - 0.11, 0.022, 4, 22);
      inner.rotateY(Math.PI / 2);
      addMesh(inner, chrome, spin);
      for (let i = 0; i < 8; i++) addBox(0.012, (R - 0.1) * 2, 0.022, chrome, spin).rotation.x = i * Math.PI / 8;
      const hub = new THREE.CylinderGeometry(0.07, 0.07, 0.2, 8);
      hub.rotateZ(Math.PI / 2);
      addMesh(hub, chrome, spin);
      const guard = new THREE.TorusGeometry(R + 0.07, 0.06, 4, 12, Math.PI * 0.86);
      guard.rotateY(Math.PI / 2);
      guard.scale(1, 1, 1);
      const cover = addMesh(guard, fender, parent, 0, R, z);
      cover.scale.x = 1.5;
      cover.rotation.x = z > 0 ? -0.5 : 0.3;
      return spin;
    };
    const rearSpin = wheel(body, axleRear[2]);
    const fork = new THREE.Group();
    fork.position.set(0, 0, -1.14);
    body.add(fork);
    const frontSpin = wheel(fork, 0);
    const local = function (p) { return [p[0], p[1], p[2] + 1.14]; };
    [-0.1, 0.1].forEach(function (x) { tube(local([x, headLow[1] - 0.06, headLow[2]]), [x, R, 0], 0.03, frame, fork); });
    tube(local(headLow), local([0, 2.34, -0.68]), 0.035, chrome, fork);

    tube([0, 2.02, 0.56], [0, 2.14, 0.6], 0.035, chrome);

    const ring = new THREE.CylinderGeometry(0.28, 0.28, 0.05, 14);

    [-1, 1].forEach(function (side) { tube([0.14, bb[1] + side * 0.26, bb[2]], [0.14, axleRear[1] + side * 0.1, axleRear[2]], 0.015, makeMaterial(c.tyre)); });
    const crank = new THREE.Group();

    const hips = [0, 2.42, 0.62];

    [0, 1].forEach(function (i) {

        crank.rotation.x = angle;

          reach(person.legs[i], footY - hips[1] + 0.12, footZ - hips[2], 0.84, 0.84);

  setCar: function (name) {
    const car = this.cars[name];
    Object.keys(this.cars).forEach(function (key) {
      this.cars[key].root.visible = key === name;
      this.cars[key].root.scale.setScalar(1);
    }, this);
    this.carName = name;
    this.bodyGroup = car.body;
    this.steerGroups = car.steerGroups;
    this.spinGroups = car.spinGroups;
    this.brakeLight = car.brakeLight;
    this.flames = car.flames;
    this.spec = car.spec;
  },

  // 곡을 틀면 그 곡의 색으로 빛나며 차종이 바뀝니다.
  swapCar: function (name, color) {
    this.flash.material.color.set(color);
    if (name === this.carName && !this.morph.active) return;
    Object.assign(this.morph, { active: true, swapped: false, time: 0, to: name });
  },

  // 주유가 끝나면 호박색 빛이 차를 감싸는 순간 차종이 바뀝니다.
  updateMorph: function (dt) {
    const morph = this.morph;
    if (!morph.active) return;
    morph.time += dt;
    const t = morph.time / morph.length, s = this.state;
    if (!morph.swapped && t >= 0.3) {
      morph.swapped = true;
      this.setCar(morph.to);
    }
    this.flash.visible = t < 1;
    this.flash.position.set(s.renderX, 0.8, s.renderZ);
    this.flash.scale.set(1.6 + t * 3.2, 1 + t * 1.8, 2.6 + t * 3.2);
    this.flash.material.opacity = 0.9 * Math.sin(Math.min(t, 1) * Math.PI);
    const pop = 1 + Math.sin(Math.min(t, 1) * Math.PI) * (t < 0.3 ? -0.14 : 0.08);
    this.cars[this.carName].root.scale.setScalar(pop);
    if (t >= 1) {
      morph.active = false;
      this.cars[this.carName].root.scale.setScalar(1);
    }
  },

buildEffects: function () {
    const scene = this.el.sceneEl.object3D;
    // 타이어 자국
    const skidGeometry = new THREE.PlaneGeometry(0.46, 0.8);

    this.skids.frustumCulled = false;

    this.skidsFilled = 0;

    this.puffs.frustumCulled = false;
    this.puffData = [];
    for (let i = 0; i < 130; i++) this.puffData.push({ life: 0, max: 1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, size: 1 });

  spawnPuff: function (x, y, z, vx, vz, size) {
    const p = this.puffData[this.puffIndex];
    this.puffIndex = (this.puffIndex + 1) % this.puffData.length;
    Object.assign(p, { life: 0.55, max: 0.55, x: x, y: y, z: z, vx: vx + (Math.random() - 0.5) * 2, vy: 1.4, vz: vz + (Math.random() - 0.5) * 2, size: size });
  },

  stepPhysics: function (h) {
    const s = this.state, c = this.spec.car, sus = this.spec.suspension;
    s.prevX = s.x;
    s.prevZ = s.z;
    s.prevHeading = s.heading;
    const sin = Math.sin(s.heading), cos = Math.cos(s.heading);
    const fx = -sin, fz = -cos, rx = cos, rz = -sin;
    let vf = s.vx * fx + s.vz * fz;
    let vr = s.vx * rx + s.vz * rz;
    const before = vf;

    s.hardBraking = input.brake && Math.abs(vf) > 0.4;
    s.boosting = input.boost && input.forward && !input.brake && !input.back;
    let accel = 0;
    const bothPedals = input.forward && input.back && !input.brake;
    if (input.brake) {
      accel = -Math.sign(vf) * Math.min(c.hardBrake, Math.abs(vf) / h);
    } else if (bothPedals) {
      accel = -Math.sign(vf) * Math.min(c.brake, Math.abs(vf) / h);
    } else if (input.forward && !input.back) {
      if (vf < -0.5) accel = c.brake;
      else {
        const top = s.boosting ? c.boostSpeed : c.topSpeed;
        const power = s.boosting ? c.boostAcceleration : c.acceleration;
        accel = vf > top ? -c.drag * (vf - top) * 2 : power * (1 - vf / top);
      }
    } else if (input.back && !input.forward) {
      if (vf > 0.5) accel = -Math.min(c.brake, vf / h);
      else accel = -c.acceleration * 0.6 * (1 + vf / c.reverseSpeed);
    } else {
      accel = -vf * c.drag - Math.sign(vf) * Math.min(0.9, Math.abs(vf) / h);
    }
    vf += accel * h;

    const steerTarget = (input.left ? 1 : 0) - (input.right ? 1 : 0);
    s.steer += (steerTarget - s.steer) * (1 - Math.exp(-h * (steerTarget ? 8 : 11)));
    const ratio = Math.min(Math.abs(vf) / c.topSpeed, 1);
    const steerLimit = c.steerLow + (c.steerHigh - c.steerLow) * Math.pow(ratio, 0.75);
    const yawRate = vf * Math.tan(s.steer * steerLimit) / c.wheelbase;
    s.heading += yawRate * h;

    vr *= Math.exp(-(input.brake ? c.brakeGrip : c.grip) * h);
    s.vx = fx * vf + rx * vr;
    s.vz = fz * vf + rz * vr;
    s.forwardSpeed = vf;
    s.slip = Math.abs(vr);
    s.aLong = (vf - before) / h;
    s.aLat = vf * yawRate;
    s.x += s.vx * h;
    s.z += s.vz * h;

    // 번아웃: 차가 멈추면 뒷바퀴만 헛돌고, A/D로 앞바퀴 축을 중심으로 뒤쪽을 천천히 돌립니다.
    s.burnout = bothPedals && Math.abs(vf) < 1;
    const burn = CONFIG.burnout, pivotTarget = s.burnout ? ((input.left ? 1 : 0) - (input.right ? 1 : 0)) * burn.pivotSpeed : 0;
    s.pivotRate += (pivotTarget - s.pivotRate) * (1 - Math.exp(-burn.pivotEase * h));
    if (!s.burnout) s.pivotRate = 0;
    if (s.pivotRate !== 0) {
      const axle = this.spec.frontAxle;
      const frontX = s.x - Math.sin(s.heading) * axle, frontZ = s.z - Math.cos(s.heading) * axle;
      s.heading += s.pivotRate * h;
      s.x = frontX + Math.sin(s.heading) * axle;
      s.z = frontZ + Math.cos(s.heading) * axle;
    }

    // 차체 스프링: 가속도가 목표 기울기가 되고, 차체는 스프링처럼 뒤따라갑니다.
    const pitchTarget = s.burnout ? burn.squat : THREE.MathUtils.clamp(s.aLong * sus.pitchPerAccel, -sus.maxPitchDown, sus.maxPitchUp);
    const rollTarget = THREE.MathUtils.clamp(-s.aLat * sus.rollPerAccel, -sus.maxRoll, sus.maxRoll);
    const heaveTarget = -Math.min(0.09, Math.abs(s.aLong) * sus.heavePerAccel);
    s.pitchV += (sus.stiffness * (pitchTarget - s.pitch) - sus.damping * s.pitchV) * h;
    s.rollV += (sus.stiffness * (rollTarget - s.roll) - sus.damping * s.rollV) * h;
    s.heaveV += (sus.stiffness * (heaveTarget - s.heave) - sus.damping * s.heaveV) * h;
    s.pitch += s.pitchV * h;
    s.roll += s.rollV * h;
    s.heave += s.heaveV * h;
    // 고속에서 바퀴가 역회전처럼 깜박이지 않도록 보이는 회전 속도에 상한을 둡니다.
    const rollingSpin = input.brake ? 0 : -THREE.MathUtils.clamp(vf / 0.4, -26, 26) * h;
    s.wheelSpin += rollingSpin;
    s.rearSpin += s.burnout ? -burn.spin * h : rollingSpin;
  },

  collide: function () {
    const s = this.state, b = WORLD.bounds;
    const limit = s.x > 0 ? WORLD.east : b;
    if (Math.abs(s.x) > limit) { s.x = Math.sign(s.x) * limit; s.vx *= -0.45; s.pitchV -= 0.5; }
    if (Math.abs(s.z) > b) { s.z = Math.sign(s.z) * b; s.vz *= -0.45; s.pitchV -= 0.5; }
    if (WORLD.glitch.on) return;   // Void에는 지형지물이 없습니다.
    WORLD.statics.forEach(function (o) {
      const dx = s.x - o.x, dz = s.z - o.z, d = Math.hypot(dx, dz), min = 1.6 + o.r;
      if (d >= min || d === 0) return;
      const nx = dx / d, nz = dz / d;
      s.x = o.x + nx * min;
      s.z = o.z + nz * min;
      const into = s.vx * nx + s.vz * nz;
      if (into < 0) {
        s.vx -= nx * into * 1.35;
        s.vz -= nz * into * 1.35;
        s.pitchV += into * 0.09;
        s.rollV += (s.vx * nz - s.vz * nx) * 0.02;
      }
    });
    const fx = -Math.sin(s.heading), fz = -Math.cos(s.heading);
    WORLD.props.forEach(function (p) {
      if (p.y > 1.4) return;
      [1.35, -1.35].forEach(function (offset) {
        const dx = p.x - (s.x + fx * offset), dz = p.z - (s.z + fz * offset);
        const d = Math.hypot(dx, dz) || 0.001, min = 0.95 + p.r;
        if (d >= min) return;
        const nx = dx / d, nz = dz / d;
        p.x += nx * (min - d);
        p.z += nz * (min - d);
        const closing = (s.vx - p.vx) * nx + (s.vz - p.vz) * nz;
        if (closing <= 0) return;
        const impulse = closing * 1.35;
        p.vx += nx * impulse;
        p.vz += nz * impulse;
        p.vy = Math.max(p.vy, Math.min(closing * 0.3, 9));
        p.spinX = (Math.random() - 0.5) * closing * 0.8;
        p.spinZ = (Math.random() - 0.5) * closing * 0.8;
        s.vx -= nx * impulse * p.mass * 0.03;
        s.vz -= nz * impulse * p.mass * 0.03;
        WORLD.wake(p);
      });
    });
  },

  updateProps: function (dt) {
    const gravity = 24, props = WORLD.props;
    props.forEach(function (p) {
      if (p.asleep) return;
      p.vy -= gravity * dt;
      p.x += p.vx * dt;
      p.z += p.vz * dt;
      p.y += p.vy * dt;
      const onGround = p.y <= 0;
      if (onGround) { p.y = 0; p.vy = Math.abs(p.vy) > 2 ? -p.vy * 0.28 : 0; }
      const friction = Math.exp(-(onGround ? 3.4 : 0.25) * dt);
      p.vx *= friction;
      p.vz *= friction;
      p.spinX *= friction;
      p.spinZ *= friction;
      p.obj.rotation.x += p.spinX * dt;
      p.obj.rotation.z += p.spinZ * dt;
      const speed = Math.hypot(p.vx, p.vz);
      if (onGround && speed < 2.2) {
        // 멈출 때는 가까운 면으로 눕거나 서도록 정렬합니다.
        const q = Math.PI / 2;
        p.obj.rotation.x += (Math.round(p.obj.rotation.x / q) * q - p.obj.rotation.x) * Math.min(1, dt * 7);
        p.obj.rotation.z += (Math.round(p.obj.rotation.z / q) * q - p.obj.rotation.z) * Math.min(1, dt * 7);
      }
      props.forEach(function (o) {
        if (o === p || Math.abs(o.y - p.y) > 1) return;
        const dx = o.x - p.x, dz = o.z - p.z, d = Math.hypot(dx, dz) || 0.001, min = o.r + p.r;
        if (d >= min) return;
        const nx = dx / d, nz = dz / d;
        p.x -= nx * (min - d) * 0.5; p.z -= nz * (min - d) * 0.5;
        o.x += nx * (min - d) * 0.5; o.z += nz * (min - d) * 0.5;
        const closing = (p.vx - o.vx) * nx + (p.vz - o.vz) * nz;
        if (closing > 0) {
          p.vx -= nx * closing * 0.7; p.vz -= nz * closing * 0.7;
          o.vx += nx * closing * 0.7; o.vz += nz * closing * 0.7;
          WORLD.wake(o);
        }
      });
      p.obj.position.set(p.x, p.y + p.baseY, p.z);
    });
  },

  stampSkids: function () {
    const s = this.state;
    const skidding = s.burnout || (s.hardBraking && Math.abs(s.forwardSpeed) > 3) || s.slip > 2.6;
    if (!skidding) { s.lastStamp = null; return; }
    const fx = -Math.sin(s.heading), fz = -Math.cos(s.heading), rx = -fz, rz = fx;
    const cx = s.x - fx * 1.5, cz = s.z - fz * 1.5;
    if (s.lastStamp && Math.hypot(cx - s.lastStamp.x, cz - s.lastStamp.z) < 0.7) return;
    const helper = this.helper, self = this;
    [-self.spec.skidWidth, self.spec.skidWidth].forEach(function (side) {
      helper.position.set(cx + rx * side, 0.07, cz + rz * side);
      helper.rotation.set(0, s.heading, 0);
      helper.updateMatrix();
      self.skids.setMatrixAt(self.skidIndex, helper.matrix);
      self.skidIndex = (self.skidIndex + 1) % 900;
      self.skidsFilled = Math.min(900, self.skidsFilled + 1);
    });
    this.skids.count = this.skidsFilled;
    this.skids.instanceMatrix.needsUpdate = true;
    s.lastStamp = { x: cx, z: cz };
  },

  updatePuffs: function (dt) {
    const s = this.state, helper = this.helper;
    const fx = -Math.sin(s.heading), fz = -Math.cos(s.heading);
    if (s.hardBraking && Math.abs(s.forwardSpeed) > 4 && Math.random() < 0.6) {
      this.spawnPuff(s.x - fx * 1.6, 0.3, s.z - fz * 1.6, s.vx * 0.3, s.vz * 0.3, 1.1);
    }
    if (s.burnout) {
      const side = this.spec.skidWidth, sideX = -fz * side, sideZ = fx * side;
      for (let wheel = -1; wheel <= 1; wheel += 2) {
        if (Math.random() < 0.8) this.spawnPuff(s.x - fx * 1.5 + sideX * wheel, 0.3, s.z - fz * 1.5 + sideZ * wheel, -fx * 2.5, -fz * 2.5, 1.5);
      }
    }
    if (s.boosting && Math.random() < 0.35) {
      this.spawnPuff(s.x - fx * 3.2, 0.7, s.z - fz * 3.2, s.vx * 0.2, s.vz * 0.2, 0.55);
    }
    for (let i = 0; i < this.puffData.length; i++) {
      const p = this.puffData[i];
      if (p.life > 0) p.life -= dt;
      const t = Math.max(p.life, 0) / p.max;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      helper.position.set(p.x, p.y, p.z);
      helper.rotation.set(t * 3, t * 5, 0);
      helper.scale.setScalar(t > 0 ? p.size * (0.4 + (1 - t) * 1.2) * Math.min(1, t * 3) : 0.0001);
      helper.updateMatrix();
      this.puffs.setMatrixAt(i, helper.matrix);
    }
    helper.scale.setScalar(1);
    this.puffs.instanceMatrix.needsUpdate = true;
  },

  startFuel: function () {
    const fuel = this.fuel, s = this.state;
    if (LAB.active) {
      LAB.exit();
      return;
    }
    if (WORLD.console.near || WORLD.player.near || LAB.near) {
      s.vx = 0;
      s.vz = 0;
      if (LAB.near) LAB.enter();
      else if (WORLD.player.near) openPicker();
      else enterConsole();
      return;
    }
    if (!fuel.near || fuel.active) return;
    fuel.active = true;
    fuel.progress = 0;
    fuel.doneTimer = 0;
    WORLD.locked = true;
    Object.keys(input).forEach(function (name) { setInput(name, false); });
    s.vx = 0;
    s.vz = 0;
    this.fuelDom.pad.classList.add('locked');
    this.fuelDom.title.textContent = '주유 중';
  },

  // 주유기 근처 판정, 게이지 진행, 차량 위 창의 화면 위치를 처리합니다.
  updateFuel: function (dt) {
    const fuel = this.fuel, dom = this.fuelDom, s = this.state, rule = CONFIG.fuel;
    fuel.near = !WORLD.glitch.on && !fuel.active && Math.hypot(s.vx, s.vz) < rule.maxSpeed && WORLD.pumps.some(function (pump) {
      return Math.hypot(pump.x - s.x, pump.z - s.z) < rule.reach;
    });
    if (fuel.active) {
      fuel.progress = Math.min(1, fuel.progress + dt / rule.seconds);
      if (fuel.progress >= 1) {
        fuel.active = false;
        fuel.doneTimer = 1.4;
        WORLD.locked = false;
        dom.pad.classList.remove('locked');
        dom.title.textContent = '주유 완료';
        if (this.carName !== 'gt') {
          this.swapCar('gt', '#ffb347');
        }
      }
    } else if (fuel.doneTimer > 0) {
      fuel.doneTimer -= dt;
    }
    const showPanel = fuel.active || fuel.doneTimer > 0, hint = showPanel ? null : LAB.active ? LAB.hint() : WORLD.locked ? null : this.findHint();
    const showPrompt = !!hint;
    if (hint) {
      const touch = window.matchMedia('(pointer: coarse)').matches;
      const text = touch ? hint.action : hint.text || (hint.ready ? '' : hint.place + ' 멈춘 뒤 ') + 'F를 눌러 ' + hint.action;
      if (dom.prompt.textContent !== text) dom.prompt.textContent = text;
      dom.prompt.classList.toggle('waiting', !hint.ready);
    }
    dom.tag.hidden = !showPanel && !showPrompt;
    dom.panel.hidden = !showPanel;
    dom.prompt.hidden = !showPrompt;
    if (dom.tag.hidden) return;
    if (showPanel) {
      dom.fill.style.width = (fuel.progress * 100) + '%';
      dom.percent.textContent = Math.round(fuel.progress * 100) + '%';
    }
    const scene = this.el.sceneEl, canvas = scene.canvas;
    this.cameraEl.object3D.updateMatrixWorld(true);
    // 안내는 해당 오브젝트 위에, 주유 게이지는 차 위에 뜹니다. 화면 밖으로 나가지 않게 가장자리에서 멈춥니다.
    if (hint) this.tagPoint.set(hint.x, CONFIG.hints.height, hint.z);
    else this.tagPoint.set(s.renderX, 3, s.renderZ);
    const point = this.tagPoint.project(scene.camera), width = canvas.clientWidth, height = canvas.clientHeight;
    const x = THREE.MathUtils.clamp((point.x + 1) / 2 * width, 130, width - 130), y = THREE.MathUtils.clamp((1 - point.y) / 2 * height, 56, height - 16);
    dom.tag.style.transform = 'translate(' + x + 'px, ' + y + 'px) translate(-50%, -100%)';
  },

  // 가까이 있는 F 상호작용을 찾습니다. ready는 지금 F를 누르면 바로 작동한다는 뜻입니다.
  findHint: function () {
    const s = this.state, h = CONFIG.hints;
    if (WORLD.glitch.on) return null;
    const close = function (spot, reach) { return Math.hypot(spot.x - s.x, spot.z - s.z) < reach; };
    if (close(WORLD.player, h.zoneReach)) return { x: WORLD.player.x, z: WORLD.player.z, ready: WORLD.player.near, place: '영역 안에', action: '곡 선택' };
    if (close(WORLD.console, h.zoneReach)) return { x: WORLD.console.x, z: WORLD.console.z, ready: WORLD.console.near, place: '영역 안에', action: '이퀄라이저 조절' };
    if (close(LAB, h.zoneReach)) return { x: LAB.x, z: LAB.z, ready: LAB.near, place: '영역 안에', action: '키보드와 마우스 연결' };
    const pump = WORLD.pumps.find(function (spot) { return close(spot, CONFIG.fuel.hintReach); });
    return pump ? { x: pump.x, z: pump.z, ready: this.fuel.near, place: '주유기 옆에', action: '주유하기' } : null;
  },

  // 구간에 들어가면 화면 위쪽에 환영 문구가 나타났다가 사라집니다.
  showZone: function (zone) {
    const label = this.zoneLabel;
    label.textContent = 'Welcome to My ' + CONFIG.zones[zone];
    label.classList.toggle('ink', zone === 'music');
    label.classList.toggle('glitch', zone === 'void');
    label.classList.add('show');
    clearTimeout(this.zoneTimer);
    this.zoneTimer = setTimeout(function () { label.classList.remove('show'); }, 2800);
  },

  // 구간을 오갈 때 하늘, 안개, 빛을 그 구간의 값으로 서서히 바꿉니다.
  updateAtmosphere: function (dt) {
    const s = this.state, zone = zoneAt(s.x, s.z) || (inLab(s.x, s.z) ? 'lab' : null);
    if (zone !== this.zone) {
      this.zone = zone;
      if (zone && !WORLD.glitch.on) this.showZone(zone);
    }
    const moodName = WORLD.glitch.on ? 'void' : zone === 'fashion' ? WORLD.fashion.theme || CONFIG.fashion.start : zone === 'lab' || !zone ? 'day' : zone;
    const mood = this.mood, target = this.moods[moodName], k = 1 - Math.exp(-2.4 * dt);
    mood.fog.lerp(target.fog, k);
    mood.sky.lerp(target.sky, k);
    mood.ground.lerp(target.ground, k);
    mood.sun.lerp(target.sun, k);
    mood.near += (target.near - mood.near) * k;
    mood.far += (target.far - mood.far) * k;
    mood.hemi += (target.hemi - mood.hemi) * k;
    mood.sunPower += (target.sunPower - mood.sunPower) * k;
    const scene = this.el.sceneEl.object3D;
    const hemi = this.skyLight.getObject3D('light'), sun = this.sun.getObject3D('light');
    if (scene.fog) {
      const viewExtra = (WORLD.viewZoom - 1) * 34;   // 멀리 볼 때 안개가 화면을 덮지 않게 함께 밀어냅니다.
      scene.fog.color.copy(mood.fog);
      scene.fog.near = mood.near + viewExtra;
      scene.fog.far = mood.far + viewExtra;
    }
    if (scene.background && scene.background.isColor) scene.background.copy(mood.fog);
    if (hemi) {
      hemi.color.copy(mood.sky);
      hemi.groundColor.copy(mood.ground);
      hemi.intensity = mood.hemi;
    }
    if (sun) {
      sun.color.copy(mood.sun);
      sun.intensity = mood.sunPower;
    }
  },

  // 그림자 지도의 픽셀 격자에 맞춰 태양을 옮겨, 이동 중 그림자 가장자리가 떨리지 않게 합니다.
  updateSun: function (x, z) {
    const axes = this.sunAxes, p = this.sunPoint.set(x, 0, z), texel = 112 / 2048;
    const right = Math.round(p.dot(axes.right) / texel) * texel;
    const up = Math.round(p.dot(axes.up) / texel) * texel;
    const depth = p.dot(axes.back);
    p.copy(axes.right).multiplyScalar(right).addScaledVector(axes.up, up).addScaledVector(axes.back, depth);
    this.sunTarget.object3D.position.copy(p);
    this.sun.object3D.position.copy(p).add(axes.offset);
  },

  tick: function (time, dtMs) {
    const rawDt = Math.min(dtMs / 1000, 0.05), step = 1 / 120, s = this.state;
    // 브라우저가 알려주는 프레임 시간의 잔떨림을 걸러냅니다. 큰 변화는 바로 따라갑니다.
    this.smoothDt = Math.abs(rawDt - this.smoothDt) > 0.012 ? rawDt : this.smoothDt + (rawDt - this.smoothDt) * 0.12;
    const dt = this.smoothDt;
    this.accumulator += dt;
    while (this.accumulator >= step) {
      this.stepPhysics(step);
      this.accumulator -= step;
    }
    const beforeX = s.x, beforeZ = s.z;
    this.collide();
    s.prevX += s.x - beforeX;
    s.prevZ += s.z - beforeZ;
    this.updateProps(dt);
    this.stampSkids();
    this.updatePuffs(dt);

    // 물리 계산은 1/120초 단위라서, 화면에는 직전 두 계산 사이의 위치를 보간해 그립니다.
    const alpha = this.accumulator / step;
    s.renderX = s.prevX + (s.x - s.prevX) * alpha;
    s.renderZ = s.prevZ + (s.z - s.prevZ) * alpha;
    const renderHeading = s.prevHeading + (s.heading - s.prevHeading) * alpha;

    const root = this.el.object3D;
    root.position.set(s.renderX, 0, s.renderZ);
    root.rotation.y = renderHeading;
    // 범프 스톱: 스프링이 튕겨도 차체는 정해진 각도까지만 기울고, 끝부분이 지면에 닿으면 차체를 들어 올립니다.
    const spec = this.spec, sus = spec.suspension;
    const pitch = THREE.MathUtils.clamp(s.pitch, -sus.maxPitchDown * 1.15, sus.maxPitchUp * 1.15);
    const roll = THREE.MathUtils.clamp(s.roll, -sus.maxRoll * 1.15, sus.maxRoll * 1.15);
    const heave = Math.max(s.heave, -0.05);
    const side = Math.sin(Math.abs(roll)) * spec.halfWidth, floor = 0.03;
    const noseLow = spec.noseClear + heave - side - Math.sin(Math.max(-pitch, 0)) * spec.noseLength;
    const tailLow = spec.tailClear + heave - side - Math.sin(Math.max(pitch, 0)) * spec.tailLength;
    this.bodyGroup.rotation.x = pitch;
    this.bodyGroup.rotation.z = roll;
    this.bodyGroup.position.y = heave + Math.max(0, floor - noseLow, floor - tailLow);
    const visualSteer = s.steer * 0.42;
    this.steerGroups.forEach(function (group) { group.rotation.y = visualSteer; });
    this.spinGroups.forEach(function (group, index) { group.rotation.x = index < 2 ? s.wheelSpin : s.rearSpin; });
    const ride = this.cars[this.carName];
    if (ride.animate) ride.animate(dt, s);

    this.brakeLight.emissiveIntensity = input.brake || (input.back && s.forwardSpeed > 0.5) ? 5 : 0;
    const flameLength = 1.1 + Math.random() * 1.1;
    this.flames.forEach(function (flame) {
      flame.visible = s.boosting;
      flame.scale.set(1, 1, flameLength);
    });

    this.updateSun(s.renderX, s.renderZ);
    this.updateAtmosphere(dt);
    updateMusic(dt, s);
    updateConsole(dt, s);
    updateFashion(dt, s);
    updateVoid(dt, s, this);
    BGM.update(dt);
    updateLab(dt, s);
    INTRO.update(dt, s.renderX, s.renderZ, this);

    // 카메라는 차를 그린 직후 같은 프레임에 움직여야 차가 화면에서 떨리지 않습니다.
    const follow = this.cameraEl.components['follow-cam'];
    if (follow) follow.follow(time, dt);
    this.updateFuel(dt);
    this.updateMorph(dt);

    this.hudTimer += dt;
  }
});

/* ---------- 전지적 고정 시점 카메라: 회전하지 않고 차를 따라 이동합니다 ---------- */
AFRAME.registerComponent('follow-cam', {
  schema: { target: { type: 'selector' } },
  init: function () {
    this.leadX = 0;
    this.leadZ = 0;
    this.offset = new THREE.Vector3().fromArray(CONFIG.camera.offset);
    this.offsetGoal = new THREE.Vector3();
    this.tilt = new THREE.Matrix4();
    this.origin = new THREE.Vector3();
    this.up = new THREE.Vector3(0, 1, 0);
    this.zoom = 1;
    this.userZoom = 1;
    this.ready = false;
    this.calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const matrix = new THREE.Matrix4().lookAt(this.offset, new THREE.Vector3(), new THREE.Vector3(0, 1, 0));
    this.el.object3D.quaternion.setFromRotationMatrix(matrix);
  },
  // f1-car가 매 프레임 끝에서 호출합니다. 차 위치는 그대로 따르고, 앞을 내다보는 거리만 부드럽게 변합니다.
  follow: function (time, dt) {
    const car = this.data.target.components['f1-car'];
    if (!car) return;
    const s = car.state, cam = CONFIG.camera;
    const blend = this.ready ? 1 - Math.exp(-cam.smoothing * dt) : 1;
    this.ready = true;
    const aspect = this.el.sceneEl.canvas ? this.el.sceneEl.canvas.clientWidth / Math.max(this.el.sceneEl.canvas.clientHeight, 1) : 1.6;
    const portrait = aspect < 1 ? 1 / Math.max(aspect, 0.55) * 0.8 : 1;
    const speedRatio = Math.min(Math.abs(s.forwardSpeed) / car.spec.car.boostSpeed, 1);
    const desk = LAB.active ? LAB.view : WORLD.console.active ? WORLD.console : null;
    const leadGoalX = desk ? desk.viewX - s.renderX : s.vx * cam.lookAhead;
    const leadGoalZ = desk ? desk.viewZ - s.renderZ : s.vz * cam.lookAhead;
    this.leadX += (leadGoalX - this.leadX) * blend;
    this.leadZ += (leadGoalZ - this.leadZ) * blend;
    this.zoom += ((LAB.active ? CONFIG.lab.viewZoom : desk ? 1.45 : 1 + speedRatio * cam.speedZoom) * portrait - this.zoom) * blend;
    this.userZoom += (WORLD.viewZoom - this.userZoom) * (1 - Math.exp(-9 * dt));
    // 랩 상호작용 중에는 책상 앞에 앉은 것처럼 카메라가 낮아집니다.
    this.offsetGoal.fromArray(LAB.active ? CONFIG.lab.viewOffset : cam.offset);
    if (this.offset.distanceToSquared(this.offsetGoal) > 0.0001) {
      this.offset.lerp(this.offsetGoal, blend);
      this.tilt.lookAt(this.offset, this.origin, this.up);
      this.el.object3D.quaternion.setFromRotationMatrix(this.tilt);
    }
    const distance = this.zoom * (LAB.active ? 1 : this.userZoom);
    // 부스터의 진동은 난수 대신 느린 파형으로 만들어 프레임마다 튀지 않습니다.
    const sway = s.boosting && !this.calm ? 0.035 : 0;
    this.el.object3D.position.set(
      s.renderX + this.leadX + this.offset.x * distance + Math.sin(time * 0.019) * sway,
      this.offset.y * distance + Math.sin(time * 0.027) * sway,
      s.renderZ + this.leadZ + this.offset.z * distance
    );
  }
});

/* ---------- 파우스트 구간의 소품 ---------- */
// 글자 윤곽을 그대로 돌출시켜 트랙 위 입체 글씨와 주유소를 가리키는 화살표를 만듭니다.
const TEXT_DEPTH = { depth: 0.32, bevelEnabled: false, curveSegments: 5 };

// ROAD_TEXT의 줄들을 돌출시켜 고정 카메라와 수평으로 눕힙니다. 줄 번호는 ROAD_TEXT.lines의 순서입니다.
function layText(root, rows, x, z, width, lineGap, material) {
  const widest = Math.max.apply(null, rows.map(function (row) { return ROAD_TEXT.lines[row].w; }));
  const scale = width / widest, shapes = [];
  rows.forEach(function (row, index) {
    const line = ROAD_TEXT.lines[row], left = -line.w * scale / 2;
    const baseline = -(index - (rows.length - 1) / 2) * lineGap;
    line.g.forEach(function (item) {
      const path = new THREE.ShapePath();
      const px = function (v) { return left + (item[1] + v) * scale; }, py = function (v) { return baseline + v * scale; };
      ROAD_TEXT.glyphs[item[0]].split(' ').forEach(function (command) {
        const type = command[0], v = command.slice(1).split(',').map(Number);
        if (type === 'M') path.moveTo(px(v[0]), py(v[1]));
        if (type === 'L') path.lineTo(px(v[0]), py(v[1]));
        if (type === 'Q') path.quadraticCurveTo(px(v[0]), py(v[1]), px(v[2]), py(v[3]));
        if (type === 'C') path.bezierCurveTo(px(v[0]), py(v[1]), px(v[2]), py(v[3]), px(v[4]), py(v[5]));
      });
      Array.prototype.push.apply(shapes, path.toShapes(false));
    });
  });
  const group = new THREE.Group();
  group.position.set(x, 0.05, z);
  group.rotation.y = Math.atan2(CONFIG.camera.offset[0], CONFIG.camera.offset[2]);
  root.add(group);
  addMesh(new THREE.ExtrudeGeometry(shapes, TEXT_DEPTH), material, group).rotation.x = -Math.PI / 2;
}

// 시작점에서 끝점을 가리키는 납작한 입체 화살표
function layArrow(root, fromX, fromZ, toX, toZ, shaft, head, material) {
  const length = Math.hypot(toX - fromX, toZ - fromZ), ux = (toX - fromX) / length, uz = (toZ - fromZ) / length;
  const neck = length - head * 1.5, side = function (along, across) {
    return [fromX + ux * along - uz * across, -(fromZ + uz * along + ux * across)];
  };
  const outline = [side(0, -shaft), side(neck, -shaft), side(neck, -head), side(length, 0), side(neck, head), side(neck, shaft), side(0, shaft)];
  const arrow = new THREE.Shape();
  outline.forEach(function (point, index) {
    if (index) arrow.lineTo(point[0], point[1]);
    else arrow.moveTo(point[0], point[1]);
  });
  arrow.closePath();
  addMesh(new THREE.ExtrudeGeometry(arrow, TEXT_DEPTH), material, root, 0, 0.05, 0).rotation.x = -Math.PI / 2;
}

function buildRoadText(root) {
  const white = makeMaterial('#ffffff', { emissive: '#ffffff', emissiveIntensity: 0.28 });
  layText(root, [0, 1, 2], -64, 71.4, 27, 3.6, white);
  layArrow(root, -71, 63.2, -71, 53.6, 0.75, 2.3, white);
}

function textTexture(text, width, height, background, foreground, font) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = background;
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = foreground;
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, width / 2, height / 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
function lathe(profile, segments) {
  return new THREE.LatheGeometry(profile.map(function (p) { return new THREE.Vector2(p[0], p[1]); }), segments);
}

function buildFaust(root, points, normals, samples) {
  const f = CONFIG.faust;
  const oak = makeMaterial(f.oak), oakDark = makeMaterial(f.oakDark), cream = makeMaterial(f.cream);
  const caramel = makeMaterial(f.caramel);
  const amberGlow = new THREE.MeshStandardMaterial({ color: f.amber, emissive: f.amber, emissiveIntensity: 1.3 });

  // 오크통
  const barrelBody = lathe([[0, -0.62], [0.52, -0.62], [0.62, -0.3], [0.66, 0], [0.62, 0.3], [0.52, 0.62], [0, 0.62]], 10);
  const barrelRing = new THREE.TorusGeometry(0.635, 0.035, 4, 10);
  barrelRing.rotateX(Math.PI / 2);
  const addBarrel = function (x, y, z, scale, solid) {
    const barrel = new THREE.Group();
    addMesh(barrelBody, oak, barrel);
    addMesh(barrelRing, oakDark, barrel, 0, 0.3, 0);
    addMesh(barrelRing, oakDark, barrel, 0, -0.3, 0);
    barrel.position.set(x, y, z);
    barrel.scale.setScalar(scale);
    root.add(barrel);
    if (solid) WORLD.statics.push({ x: x, z: z, r: scale * 0.7 });
  };

  // 구간 입구와 출구의 아치: 트랙이 구간 경계를 넘는 지점을 찾아 세웁니다.
  let lastArch = -999;
  for (let i = 0; i < samples; i++) {
    const p = points[i], next = points[i + 1];
    if (inFaust(p.x, p.z) === inFaust(next.x, next.z) || i - lastArch < 20) continue;
    lastArch = i;
    WORLD.arches.push({ x: p.x, z: p.z });
    const n = normals[i];
    [-1, 1].forEach(function (side) {
      const x = p.x + n.x * side * 10.2, z = p.z + n.z * side * 10.2;
      addBarrel(x, 1.2, z, 1.9, true);
      addBarrel(x, 3.6, z, 1.9, false);
      addBarrel(x, 6, z, 1.9, false);
    });
    const beam = addBox(22, 0.8, 1.4, oakDark, root, p.x, 7.5, p.z);
    beam.rotation.y = -Math.atan2(n.z, n.x);
    for (let k = -2; k <= 2; k++) {
      addBox(0.7, 0.3, 0.7, amberGlow, root, p.x + n.x * k * 4, 6.95, p.z + n.z * k * 4);
    }
  }

  // 트랙 가장자리의 호박색 가로등
  for (let i = 0; i < samples; i += 18) {
    const p = points[i], n = normals[i];
    if (!inFaust(p.x, p.z)) continue;
    const side = (i / 18) % 2 ? 1 : -1, x = p.x + n.x * side * 11.5, z = p.z + n.z * side * 11.5;
    if (x > -88 && x < -54 && z > 20 && z < 64) continue;
    addBox(0.25, 3.4, 0.25, oakDark, root, x, 1.7, z);
    addBox(0.8, 0.6, 0.8, amberGlow, root, x, 3.6, z);
    WORLD.statics.push({ x: x, z: z, r: 0.3 });
  }

  // 주유소 앞 흙마당
  const yard = new THREE.Mesh(new THREE.PlaneGeometry(36, 42), new THREE.MeshStandardMaterial({ color: f.dirt, roughness: 1 }));
  yard.rotation.x = -Math.PI / 2;
  yard.position.set(-71, 0.015, 41.5);   // 트랙(0.03)보다 낮게 두어 트랙이 마당을 덮습니다.
  yard.receiveShadow = true;
  root.add(yard);

  // 서부 영화풍 나무 술집
  const saloon = new THREE.Group();
  saloon.position.set(-71, 0, 26);
  root.add(saloon);
  addBox(22, 5.6, 9, oak, saloon, 0, 2.8, 0);
  addBox(22.6, 0.35, 9.6, oakDark, saloon, 0, 5.7, 0);
  // 앞면만 높게 세운 계단형 널빤지 벽
  for (let i = 0; i < 20; i++) {
    const distance = Math.abs(i - 9.5);
    const height = distance < 3 ? 10.6 : distance < 6 ? 9.6 : distance < 8.5 ? 8.6 : 6.6;
    addBox(1.08, height, 0.3, i % 3 ? oak : caramel, saloon, (i - 9.5) * 1.15, height / 2, 4.7);
  }
  addBox(23.2, 0.3, 0.5, oakDark, saloon, 0, 5, 4.9);
  const saloonSign = new THREE.Mesh(new THREE.PlaneGeometry(16, 2.6), new THREE.MeshStandardMaterial({
    map: textTexture('FAUST SALOON', 1024, 170, f.oakDark, f.amber, '700 112px Georgia, serif'), roughness: 0.7
  }));
  saloonSign.position.set(0, 7, 4.9);
  saloon.add(saloonSign);
  // 입구와 창문, 스윙 도어
  addBox(3.2, 3.9, 0.1, oakDark, saloon, 0, 2.2, 4.9);
  addBox(2.7, 3.2, 0.1, amberGlow, saloon, 0, 2.05, 4.96);
  addBox(1.3, 1.6, 0.1, oak, saloon, -0.68, 1.9, 5.04);

  const bottleHeight = 18.2, bottleWidth = 1.22;

  const liquidOf = function (color, glow) {

  const paintLabel = function (width, height, draw) {
    const canvas = document.createElement('canvas');

    texture.colorSpace = THREE.SRGBColorSpace;

  const wrapLabel = function (parent, radius, bottom, top, spread, texture, topRadius) {

  const darkRum = standBottle(-94, 37, 3.3);

  const whiteRum = standBottle(-104, 20, 3.2);

  // 건물만한 칵테일 잔: 코스터, 크리스털 컷 유리, 붉은 칵테일, 큰 얼음, 로즈마리

  const cutGlass = glassOf(f.cutGlass, 0.34);
  // 아래쪽은 삼각형 면이 엇갈리는 다이아몬드 컷, 위쪽은 매끈한 림
  const facetRings = [[6.9, 0.32], [7.15, 1.9], [7.3, 3.5], [7.5, 5.1], [7.62, 6.7], [7.72, 8.3]];
  const facets = 14, cut = [];
  facetRings.forEach(function (ring, level) {
    const points3 = [];
    for (let i = 0; i < facets; i++) {
      const angle = (i + (level % 2) * 0.5) / facets * Math.PI * 2, r = ring[0] + (level % 2 ? 0.34 : 0);
      points3.push([Math.cos(angle) * r, ring[1], Math.sin(angle) * r]);
    }
    cut.push(points3);
  });
  const cutPositions = [];
  const cutTri = function (a, b, c) { cutPositions.push.apply(cutPositions, a.concat(b, c)); };
  for (let level = 0; level < cut.length - 1; level++) {
    for (let i = 0; i < facets; i++) {
      const n = (i + 1) % facets, lower = cut[level], upper = cut[level + 1];
      if (level % 2) {
        cutTri(lower[i], upper[i], upper[n]);
        cutTri(lower[i], upper[n], lower[n]);
      } else {
        cutTri(lower[i], upper[n], lower[n]);
        cutTri(lower[i], upper[(i + facets - 1) % facets], upper[n]);
        cutTri(lower[i], upper[i], upper[n]);
      }
    }
  }
  const cutGeometry = new THREE.BufferGeometry();
  cutGeometry.setAttribute('position', new THREE.Float32BufferAttribute(cutPositions, 3));
  cutGeometry.computeVertexNormals();
  const cutMesh = new THREE.Mesh(cutGeometry, cutGlass);

  addMesh(new THREE.CylinderGeometry(6.8, 6.9, 1.2, 14), makeMaterial(f.cutGlass, { transparent: true, opacity: 0.55, roughness: 0.1 }), tumbler, 0, 0.92, 0);
  const iceMaterial = makeMaterial(f.ice, { transparent: true, opacity: 0.62, roughness: 0.1 });
  addBox(7.6, 7.2, 7.6, iceMaterial, tumbler, 0, 7.8, 0).rotation.set(0.14, 0.5, 0.1);
  // 로즈마리 가지
  const stemFrom = [1, 8, -0.6], stemTo = [5.8, 18.6, 3.2];
  const herb = makeMaterial(f.rosemary), herbDark = makeMaterial(f.rosemaryDark);
  addMesh(tubeBetween(stemFrom, stemTo, 0.14), makeMaterial(f.stem), tumbler);
  const needle = new THREE.BoxGeometry(0.14, 2.2, 0.32);
  for (let i = 0; i < 46; i++) {
    const t = 0.32 + i / 46 * 0.68, side = i % 2 ? 1 : -1, leaf = new THREE.Group();
    leaf.position.set(stemFrom[0] + (stemTo[0] - stemFrom[0]) * t, stemFrom[1] + (stemTo[1] - stemFrom[1]) * t, stemFrom[2] + (stemTo[2] - stemFrom[2]) * t);
    leaf.rotation.set(0.5 + (i % 5) * 0.14, i * 2.4, side * (0.75 - t * 0.35));
    addMesh(needle, i % 3 ? herb : herbDark, leaf, 0, 1, 0);
    tumbler.add(leaf);
  }
  WORLD.statics.push({ x: -47, z: 33, r: 8.3 });

/* ---------- 음악 재생: 실제 곡이 없을 때는 데모 음을 합성하고, 모든 소리는 3밴드 이퀄라이저를 통과합니다 ---------- */
const AUDIO = {
  ctx: null, master: null, analyser: null, bands: [], noise: null, spectrum: null,
  current: -1, timer: null, step: 0, nextTime: 0, startedAt: 0, element: null, gains: [0, 0, 0], paused: false, volume: 0.8,

  ensure: function () {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const Context = window.AudioContext || window.webkitAudioContext;
    if (!Context) return;
    const ctx = this.ctx = new Context();
    this.master = ctx.createGain();
    this.master.gain.value = this.volume * 0.7;
    const settings = [['lowshelf', 180], ['peaking', 1000], ['highshelf', 4500]];
    this.bands = settings.map(function (item, index) {
      const filter = ctx.createBiquadFilter();
      filter.type = item[0];
      filter.frequency.value = item[1];
      filter.Q.value = 0.9;
      filter.gain.value = AUDIO.gains[index];
      return filter;
    });
    this.analyser = ctx.createAnalyser();
    this.analyser.fftSize = 128;
    this.spectrum = new Uint8Array(this.analyser.frequencyBinCount);
    this.master.connect(this.bands[0]);
    this.bands[0].connect(this.bands[1]);
    this.bands[1].connect(this.bands[2]);
    this.bands[2].connect(this.analyser);
    this.analyser.connect(ctx.destination);
    this.noise = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate);
    const samples = this.noise.getChannelData(0);
    for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
    ctx.resume();
  },

  setEq: function (index, db) {
    this.gains[index] = db;
    if (this.bands[index]) this.bands[index].gain.setTargetAtTime(db, this.ctx.currentTime, 0.02);
  },

  setVolume: function (value) {
    this.volume = value;
    if (this.master) {
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.setTargetAtTime(value * 0.7, this.ctx.currentTime, 0.02);
    }
  },

  pause: function () {
    if (this.current < 0 || this.paused) return;
    this.paused = true;
    if (this.element) this.element.pause();
    clearInterval(this.timer);
    this.timer = null;
  },

  resume: function () {
    if (this.current < 0 || !this.paused) return;
    this.paused = false;
    this.ensure();
    if (this.element) {
      const started = this.element.play();
      if (started) started.catch(function () {});
    } else {
      this.nextTime = this.ctx.currentTime + 0.05;
      this.timer = setInterval(this.schedule.bind(this), 40);
    }
  },

  // 현재 곡의 재생 위치: 0~1
  progress: function () {
    if (this.current < 0 || !this.ctx) return 0;
    const element = this.element, length = element && isFinite(element.duration) ? element.duration : CONFIG.music.songs[this.current].length;
    return (element ? element.currentTime : (this.ctx.currentTime - this.startedAt) % length) / length;
  },

  play: function (index) {
    this.ensure();
    this.stop();
    if (!this.ctx) return;
    this.paused = false;
    this.current = index;
    this.startedAt = this.ctx.currentTime;
    this.demo = false;
    const song = CONFIG.music.songs[index], self = this;
    if (!song.src) { this.startDemo(); return; }
    // 실제 곡: music 폴더의 파일을 재생합니다. 파일이 없거나 재생할 수 없으면 데모 음으로 대신합니다.
    const element = this.element = new Audio(song.src);
    element.loop = true;
    element.addEventListener('error', function () {
      if (self.element !== element) return;
      self.element = null;
      self.startDemo();
    });
    this.ctx.createMediaElementSource(element).connect(this.master);
    const started = element.play();
    if (started) started.catch(function () {});
  },

  startDemo: function () {
    this.demo = true;
    this.step = 0;
    this.nextTime = this.ctx.currentTime + 0.05;
    this.schedule();
    this.timer = setInterval(this.schedule.bind(this), 40);
    drawBoard();
  },

  stop: function () {
    clearInterval(this.timer);
    this.timer = null;
    if (this.element) { this.element.pause(); this.element = null; }
    this.current = -1;
    this.paused = false;
  },

  schedule: function () {
    const song = CONFIG.music.songs[this.current];
    if (!song || !song.demo) return;
    const demo = song.demo, stepLength = 60 / demo.bpm / 4;
    while (this.nextTime < this.ctx.currentTime + 0.14) {
      const i = this.step % 16, bar = Math.floor(this.step / 16) % demo.bass.length;
      if (demo.kick[i] === 'x') this.kick(this.nextTime);
      if (demo.hat[i] === 'x') this.hat(this.nextTime);
      const bass = demo.bass[bar][i], lead = demo.lead[bar][i];
      if (bass) this.tone('sawtooth', bass, this.nextTime, stepLength * 1.7, 0.2);
      if (lead) this.tone('triangle', lead, this.nextTime, stepLength * 2.4, 0.16);
      this.step += 1;
      this.nextTime += stepLength;
    }
  },

  tone: function (type, midi, time, length, volume) {
    const ctx = this.ctx, osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
    gain.gain.setValueAtTime(volume, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + length);
    osc.connect(gain);
    gain.connect(this.master);
    osc.start(time);
    osc.stop(time + length);
  },

  kick: function (time) {
    const ctx = this.ctx, osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.setValueAtTime(140, time);
    osc.frequency.exponentialRampToValueAtTime(46, time + 0.12);
    gain.gain.setValueAtTime(0.75, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.24);
    osc.connect(gain);
    gain.connect(this.master);
    osc.start(time);
    osc.stop(time + 0.25);
  },

  hat: function (time) {
    const ctx = this.ctx, source = ctx.createBufferSource(), gain = ctx.createGain(), filter = ctx.createBiquadFilter();
    source.buffer = this.noise;
    filter.type = 'highpass';
    filter.frequency.value = 7000;
    gain.gain.setValueAtTime(0.12, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(this.master);
    source.start(time);
    source.stop(time + 0.06);
  },

  // 0~1 저음 세기. 거대 스피커가 이 값에 맞춰 움직입니다.
  bass: function () {
    if (this.current < 0 || !this.analyser) return 0;
    this.analyser.getByteFrequencyData(this.spectrum);
    return (this.spectrum[1] + this.spectrum[2] + this.spectrum[3]) / 765;
  }
};

/* ---------- 배경음: 지금 상황에 맞는 음원 하나만 들리도록 정합니다 ---------- */
const BGM = {
  started: false, tracks: {},
  start: function () {
    if (this.started) return;
    this.started = true;
    const c = CONFIG.music.background, tracks = this.tracks;
    ['lofi', 'void'].forEach(function (name) {
      const element = new Audio(c[name]);
      element.loop = true;
      element.preload = 'auto';
      element.volume = 0;
      tracks[name] = { element: element, level: 0 };
    });
  },
  // 파일이 없으면 조용히 넘어갑니다.
  play: function (track) {
    if (!track.element.paused) return;
    const started = track.element.play();
    if (started) started.catch(function () {});
  },
  update: function (dt) {
    if (!this.started) return;
    const c = CONFIG.music.background, inVoid = WORLD.glitch.on, song = AUDIO.current >= 0 && !AUDIO.paused;
    const goals = { lofi: !inVoid && !song, void: inVoid };
    Object.keys(this.tracks).forEach(function (name) {
      const track = BGM.tracks[name], goal = goals[name] ? 1 : 0;
      track.level += Math.sign(goal - track.level) * Math.min(Math.abs(goal - track.level), dt * c.fade);
      track.element.volume = Math.min(1, track.level * c.level * AUDIO.volume);
      if (goal) BGM.play(track);
      else if (track.level <= 0 && !track.element.paused) track.element.pause();
    });
  }
};

/* ---------- 음향 장비 비주얼라이저: 장비 주변 바닥의 막대가 음악에 반응합니다 ---------- */
const VISUALIZER = {
  materials: [],
  rings: [],
  // 장비 주변 바닥에 원형으로 서는 스펙트럼 막대
  ring: function (root, x, z, radiusX, radiusZ, angle, count) {
    const material = new THREE.MeshBasicMaterial({ color: '#ffffff', fog: false });
    material.visible = false;
    this.materials.push(material);
    const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.62, 1, 0.62), material, count);
    mesh.frustumCulled = false;
    root.add(mesh);
    const spots = [];
    for (let i = 0; i < count; i++) {
      const t = i / count * Math.PI * 2, px = Math.cos(t) * radiusX, pz = Math.sin(t) * radiusZ;
      spots.push([x + px * Math.cos(angle) + pz * Math.sin(angle), z - px * Math.sin(angle) + pz * Math.cos(angle)]);
    }
    for (let i = 0; i < count; i++) mesh.setColorAt(i, this.shade(0));
    this.rings.push({ mesh: mesh, spots: spots });
  },

  // 소리가 작으면 연한 핑크, 커질수록 포인트 핑크를 지나 진한 핑크가 됩니다.
  shade: function (level, ramp) {
    const stops = ramp || CONFIG.music.visualizer, tone = this.tone || (this.tone = new THREE.Color()), edge = stops.middleAt;
    if (level < edge) return tone.set(stops.low).lerp(new THREE.Color(stops.mid), level / edge);
    return tone.set(stops.mid).lerp(new THREE.Color(stops.high), (level - edge) / (1 - edge));
  },

  setSong: function (song) {
    const on = !!song;
    this.materials.forEach(function (material) { material.visible = on; });
  },

  update: function () {
    const spectrum = AUDIO.spectrum, helper = VISUALIZER.helper || (VISUALIZER.helper = new THREE.Object3D());
    if (!spectrum || AUDIO.current < 0) return;
    this.rings.forEach(function (ring) {
      const count = ring.spots.length;
      ring.spots.forEach(function (spot, index) {
        // 원을 따라 저음에서 고음으로 갔다가 되돌아오도록 좌우 대칭으로 배치합니다.
        const bin = Math.floor(Math.abs(index / count * 2 - 1) * 34);
        const level = spectrum[bin] / 255, height = 0.3 + level * level * 9;
        helper.position.set(spot[0], height / 2, spot[1]);
        helper.scale.set(1, height, 1);
        helper.updateMatrix();
        ring.mesh.setMatrixAt(index, helper.matrix);
        ring.mesh.setColorAt(index, VISUALIZER.shade(level));
      });
      ring.mesh.instanceMatrix.needsUpdate = true;
      ring.mesh.instanceColor.needsUpdate = true;
    });
  }
};

/* ---------- 노래 구간 ---------- */
function flatLabel(text, x, z, width, height, color, parent) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = Math.round(512 * height / width);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = '700 ' + Math.round(canvas.height * 0.72) + 'px "Saira Extra Condensed", "Arial Narrow", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const label = new THREE.Mesh(new THREE.PlaneGeometry(width, height), new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false }));

// 두 점을 잇는 둥근 막대
function tubeBetween(a, b, radius) {

}
// 두 점을 잇는 납작한 띠

// XY 평면의 곡선을 따라 납작한 타원 단면을 이어 헤드밴드를 만듭니다.
function sweep(path, section, sides) {
  const curve = new THREE.CatmullRomCurve3(path.map(function (p) { return new THREE.Vector3(p[0], p[1], 0); }));
  const steps = 36, rings = [];

    const t = i / steps, point = curve.getPoint(t), tangent = curve.getTangent(t), size = section(t);
    const ring = [];
    for (let k = 0; k < sides; k++) {
      const angle = k / sides * Math.PI * 2;
      const across = Math.cos(angle) * size.thick / 2, depth = Math.sin(angle) * size.wide / 2;
      ring.push([point.x - tangent.y * across, point.y + tangent.x * across, depth]);
    }
    rings.push(ring);
  }
  const positions = [];
  const tri = function (a, b, c) { positions.push.apply(positions, a.concat(b, c)); };
  for (let i = 0; i < steps; i++) {
    for (let k = 0; k < sides; k++) {
      const n = (k + 1) % sides, a = rings[i][k], b = rings[i][n], c = rings[i + 1][n], d = rings[i + 1][k];
      tri(a, d, b);
      tri(b, d, c);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.computeVertexNormals();
  return geometry;
}

// 노래 구간의 회전 큐브: 네 옆면에 턴테이블의 레코드판을 그렸습니다.
function cubeTexture(size) {
  const m = CONFIG.music, canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d'), c = size / 2, turn = Math.PI * 2;

  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = size * 0.004;

    ctx.arc(c, c, size * r, 0, turn);
    ctx.stroke();

  ctx.arc(c, c, size * 0.12, 0, turn);
  ctx.fill();
  ctx.fillStyle = m.pink;
  ctx.beginPath();
  ctx.arc(c, c, size * 0.022, 0, turn);

  texture.anisotropy = 4;

}

function grooveTexture() {

function buildMusic(root, points, normals, samples) {
  const m = CONFIG.music, facing = Math.atan2(CONFIG.camera.offset[0], CONFIG.camera.offset[2]);
  const nearest = function (x, z) {
    let best = 0, distance = Infinity;
    for (let i = 0; i < samples; i++) {
      const d = Math.hypot(points[i].x - x, points[i].z - z);
      if (d < distance) { distance = d; best = i; }
    }
    return best;
  };
  const shell = makeMaterial(m.shell), deck = makeMaterial(m.deck);
  const black = makeMaterial(m.ink, { roughness: 0.5 }), white = makeMaterial(m.white), line = makeMaterial(m.metal);
  const neon = black;
  const clear = function (x, z, r) { WORLD.clearings.push({ x: x, z: z, r: r }); };

  // 구간 경계의 스피커 아치. 바로 옆에 다른 아치가 있으면 세우지 않습니다.
  for (let i = 0; i < samples; i++) {
    const p = points[i], next = points[i + 1];
    if (inMusic(p.x, p.z) === inMusic(next.x, next.z)) continue;
    if (WORLD.arches.some(function (a) { return Math.hypot(a.x - p.x, a.z - p.z) < 34; })) continue;
    WORLD.arches.push({ x: p.x, z: p.z });
    const n = normals[i];
    [-1, 1].forEach(function (side) {
      const x = p.x + n.x * side * 10.2, z = p.z + n.z * side * 10.2;
      for (let k = 0; k < 3; k++) {

      WORLD.statics.push({ x: x, z: z, r: 1.6 });
    });
    addBox(22, 0.7, 1.2, shell, root, p.x, 7.5, p.z).rotation.y = -Math.atan2(n.z, n.x);
    for (let k = -2; k <= 2; k++) addBox(0.7, 0.25, 0.7, neon, root, p.x + n.x * k * 4, 7.05, p.z + n.z * k * 4);
  }

  // 트랙 위 플레이어 간판
  const boardIndex = nearest(-8, -74), boardPoint = points[boardIndex], boardNormal = normals[boardIndex];
  // 기둥은 카메라 반대쪽 한 곳에만 세워 간판을 가리지 않습니다.

  addBox(7.6, 0.6, 0.8, shell, root, boardPoint.x + boardNormal.x * 6.2, 11.6, boardPoint.z + boardNormal.z * 6.2).rotation.y = -Math.atan2(boardNormal.z, boardNormal.x);
  const boardCanvas = document.createElement('canvas');

  [-10, 0, 10].forEach(function (x) {

  // 거대 다이내믹 마이크: 제품 사진의 비율과 부품 구성을 따라 만들었습니다.
