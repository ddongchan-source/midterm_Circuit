function updateSlider(slider) {
  const travel = slider.max;
  slider.knob.position.z = -slider.t;
  slider.fill.scale.z = Math.max(0.01, slider.t + travel);
  slider.fill.position.z = (travel - slider.t) / 2;
  slider.db = (slider.t / travel) * CONFIG.music.maxDb;
  AUDIO.setEq(slider.index, slider.db);
}

// 콘솔 모드: A/D로 밴드를 고르고 W/S를 누르는 동안 값이 움직입니다.
function selectBand(band) {
  const desk = WORLD.console, dom = document.querySelectorAll('.band');
  desk.band = (band + WORLD.sliders.length) % WORLD.sliders.length;
  WORLD.sliders.forEach(function (slider, index) {
    const selected = desk.active && index === desk.band;
    slider.paint.color.set(selected ? CONFIG.music.pink : CONFIG.music.ink);
    slider.mark.color.set(selected ? CONFIG.music.white : CONFIG.music.pink);
    dom[index].classList.toggle('on', selected);
  });
}
function enterConsole() {
  const desk = WORLD.console;
  desk.active = true;
  WORLD.locked = true;
  Object.keys(input).forEach(function (name) { setInput(name, false); });
  document.getElementById('consolePanel').hidden = false;
  selectBand(desk.band);
}
function exitConsole() {
  const desk = WORLD.console;
  if (!desk.active) return;
  desk.active = false;
  desk.up = false;
  desk.down = false;
  WORLD.locked = false;
  document.getElementById('consolePanel').hidden = true;
  document.querySelectorAll('.key.on').forEach(function (key) { key.classList.remove('on'); });
  selectBand(desk.band);
}
function consoleInput(name, pressed) {
  const desk = WORLD.console;
  const key = document.querySelector('.key[data-input="' + name + '"]');
  if (key) key.classList.toggle('on', pressed);
  if (name === 'forward') desk.up = pressed;
  if (name === 'back') desk.down = pressed;
  if (name === 'left' && pressed) selectBand(desk.band - 1);
  if (name === 'right' && pressed) selectBand(desk.band + 1);
}
function updateConsole(dt, s) {
  const desk = WORLD.console, m = CONFIG.music;
  if (!desk.glow) return;
  const dx = s.x - desk.x, dz = s.z - desk.z;
  const inside = Math.abs(dx * desk.rightX + dz * desk.rightZ) < desk.halfWidth && Math.abs(dx * desk.backX + dz * desk.backZ) < desk.halfDepth;
  desk.near = inside && !WORLD.glitch.on && !desk.active && Math.hypot(s.vx, s.vz) < CONFIG.fuel.maxSpeed;
  desk.time += dt;
  desk.glow.material.opacity = (inside ? 0.9 : 0.62) + Math.sin(desk.time * 3.2) * (inside ? 0.1 : 0.2);
  if (!desk.active) return;
  const slider = WORLD.sliders[desk.band], direction = (desk.up ? 1 : 0) - (desk.down ? 1 : 0);
  if (direction) {
    const next = THREE.MathUtils.clamp(slider.t + direction * slider.max / m.faderSeconds * dt, slider.min, slider.max);
    if (next !== slider.t) {
      slider.t = next;
      updateSlider(slider);
    }
  }
  document.querySelectorAll('.band strong').forEach(function (value, index) {
    const db = WORLD.sliders[index].db;
    value.textContent = (db >= 0 ? '+' : '−') + Math.abs(db).toFixed(1);
  });
}

function setActiveSong(index) {
  const m = CONFIG.music, song = m.songs[index], player = WORLD.player;
  player.label.map = song ? LABEL_TEXTURES[index] : null;
  player.label.color.set(song ? '#ffffff' : m.lp.label);
  player.label.needsUpdate = true;
  VISUALIZER.setSong(song);
  if (song) WORLD.swapCar(song.car, m.pink);
  drawBoard();
}

// 곡을 재생합니다. 곡이 바뀌면 그 곡의 차로 바뀝니다. 글리치 구간에서는 흑백 포뮬러로 고정됩니다.
function chooseSong(index) {
  AUDIO.play(index);
  setActiveSong(index);
  document.getElementById('mini').hidden = false;
  updateMini();
}
function stepSong(step) {
  if (WORLD.glitch.on) return;   // Void에서는 곡을 바꿀 수 없습니다.
  const count = CONFIG.music.songs.length, base = Math.max(AUDIO.current, 0);
  chooseSong((base + step + count) % count);
}
function toggleSong() {
  if (WORLD.glitch.on) return;
  if (AUDIO.paused) AUDIO.resume();
  else AUDIO.pause();
  updateMini();
}
function updateMini() {
  const index = AUDIO.current, locked = WORLD.glitch.on;
  document.getElementById('mini').classList.toggle('locked', locked);
  if (locked) {
    // Void에서는 Void의 곡만 표시하고 조작은 볼륨만 남깁니다.
    const void_ = BGM.started ? BGM.tracks.void.element : null;
    document.getElementById('miniTitle').textContent = CONFIG.music.background.voidTitle;
    document.getElementById('miniArtist').textContent = '';
    document.getElementById('miniFill').style.width = void_ && void_.duration ? (void_.currentTime / void_.duration * 100) + '%' : '0%';
    updateMini.index = -2;
    return;
  }
  if (index < 0) return;

function drawBoard() {

  const song = m.songs[AUDIO.current], playing = AUDIO.current >= 0, font = '"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

// 곡 버튼, 간판, 거대 스피커를 매 프레임 갱신합니다.
function updateMusic(dt, s) {

  music.time += dt;
  // LP 플레이어: 재생 중에는 판이 돌고 톤암이 재생 위치를 따라 안쪽으로 움직입니다.

  player.near = inside && !WORLD.glitch.on && !player.open && Math.hypot(s.vx, s.vz) < CONFIG.fuel.maxSpeed;
  player.glow.material.opacity = (inside ? 0.9 : 0.62) + Math.sin(music.time * 3.2) * (inside ? 0.1 : 0.2);
  const speed = player.spin = (player.spin || 0) + ((playing ? lp.spin : 0) - (player.spin || 0)) * (1 - Math.exp(-3 * dt));
  player.disc.rotation.y -= speed * dt;
  const armGoal = playing ? lp.armStart + (lp.armEnd - lp.armStart) * AUDIO.progress() : lp.armRest;
  player.armAngle += (armGoal - player.armAngle) * (1 - Math.exp(-3.2 * dt));
  player.arm.rotation.y = player.armAngle;
  player.lamp.color.set(playing ? CONFIG.music.pink : CONFIG.music.metal);
  // 회전 큐브: 턴테이블처럼 돌면서 위아래로 둥실거립니다.
  const cube = WORLD.cube, spin = CONFIG.music.cube;
  if (!music.calm) {
    cube.mesh.rotation.y += spin.turn * dt;
    cube.platter.rotation.y = cube.mesh.rotation.y;
    cube.mesh.position.y = spin.height + Math.sin(music.time * 1.3) * spin.bob;
  }
  const bass = AUDIO.bass();
  VISUALIZER.update();
  music.radiators.forEach(function (item) {
    item.mesh.position.z = item.base + bass * 0.34;
  });
  music.timer += dt;
  if (music.timer > 0.1) {
    music.timer = 0;
    updateMini();
    if (Math.hypot(music.boardPoint.x - s.x, music.boardPoint.z - s.z) < 90) drawBoard();
  }
}

/* ---------- 패션 구간: 아이템 박스, 관중, 테마 전환 ---------- */
function boxTexture(name, theme) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 256;
  const ctx = canvas.getContext('2d'), b = theme.box;
  ctx.fillStyle = b.fill;
  ctx.fillRect(0, 0, 256, 256);
  ctx.strokeStyle = b.weave;
  ctx.lineWidth = 2;
  for (let i = -256; i < 256; i += 7) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i + 256, 256);
    ctx.stroke();
  }
  ctx.strokeStyle = b.edge;
  ctx.lineWidth = 5;
  ctx.setLineDash(b.dash || []);
  ctx.strokeRect(14, 14, 228, 228);
  ctx.setLineDash([]);
  ctx.fillStyle = b.edge;
  ctx.font = '900 150px Georgia, "Times New Roman", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('?', 128, 106);
  ctx.font = '700 37px Georgia, "Times New Roman", serif';
  ctx.fillText(name.toUpperCase(), 128, 206);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
// 여러 상자를 하나의 지오메트리로 합칩니다. 관중 수백 명을 인스턴스로 그리기 위한 도우미입니다.
function joinBoxes(list) {
  const positions = [], normals = [], matrix = new THREE.Matrix4(), rotate = new THREE.Euler();
  list.forEach(function (b) {
    const box = new THREE.BoxGeometry(b[0], b[1], b[2]).toNonIndexed();
    rotate.set(0, 0, b[6] || 0);
    matrix.makeRotationFromEuler(rotate).setPosition(b[3], b[4], b[5]);
    box.applyMatrix4(matrix);
    positions.push.apply(positions, Array.from(box.attributes.position.array));
    normals.push.apply(normals, Array.from(box.attributes.normal.array));
  });
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  return geometry;
}
function fashionPaint(material, key) {
  WORLD.fashion.paints.push({ material: material, key: key, target: new THREE.Color(), tint: material.emissiveIntensity > 0 });
  return material;
}

function buildFashion(root, points, normals, samples) {
  const f = WORLD.fashion, c = CONFIG.fashion, first = c.themes[c.start];
  const nearest = function (x, z) {
    let best = 0, distance = Infinity;
    for (let i = 0; i < samples; i++) {
      const d = Math.hypot(points[i].x - x, points[i].z - z);
      if (d < distance) { distance = d; best = i; }
    }
    return best;

  // 트랙 바깥 방향(화면 위쪽)을 가리키는 법선
  const outward = function (i) { const n = normals[i]; return n.z < 0 ? n : n.clone().negate(); };

  layText(root, [8, 9], c.textAt[0], c.textAt[1], 31, 4.6, letters);
  const arrowX = c.textAt[0] - Math.sin(turn) * 5, arrowZ = c.textAt[1] - Math.cos(turn) * 5, reachX = gate.x - arrowX, reachZ = gate.z - arrowZ, reachLength = Math.hypot(reachX, reachZ);
  layArrow(root, arrowX, arrowZ, arrowX + reachX / reachLength * (reachLength - 5.5), arrowZ + reachZ / reachLength * (reachLength - 5.5), 0.34, 1.2, letters);
  WORLD.clearings.push({ x: c.textAt[0], z: c.textAt[1], r: 20 });

  const body = joinBoxes([[0.86, 1.05, 0.52, 0, 0.74, 0], [0.26, 0.54, 0.3, -0.25, -0.02, 0], [0.26, 0.54, 0.3, 0.25, -0.02, 0]]);
  const inner = joinBoxes([[0.3, 0.76, 0.05, 0, 0.84, 0.27]]);
  const head = joinBoxes([[0.5, 0.52, 0.5, 0, 1.56, 0], [0.54, 0.2, 0.54, 0, 1.78, -0.02]]);
  const arms = joinBoxes([[0.22, 0.86, 0.24, -0.62, 0.36, 0, -0.26], [0.22, 0.86, 0.24, 0.62, 0.36, 0, 0.26]]);

  const crowd = [];
  c.stands.forEach(function (at) {

    for (let row = 0; row < c.rows; row++) {

      for (let k = 0; k < c.perRow; k++) {
        const side = (k - (c.perRow - 1) / 2) * (c.standLength / c.perRow) + (row % 2 ? 0.3 : -0.3);

      }

    addBox(c.standLength + 0.4, 0.06, 0.1, seat, block, 0, 1.15, c.standFrom - c.rowDepth / 2 - 0.15);
    [-1, 1].forEach(function (sideEnd) { addBox(0.4, c.rows * c.rowRise + 0.8, c.rows * c.rowDepth, trim, block, sideEnd * (c.standLength / 2 + 0.2), (c.rows * c.rowRise + 0.8) / 2, c.standFrom + (c.rows - 1) * c.rowDepth / 2); });
    for (let k = -3; k <= 3; k++) {
      WORLD.statics.push({ x: p.x + n.x * (c.standFrom + 0.6) + Math.cos(angle) * k * 3.8, z: p.z + n.z * (c.standFrom + 0.6) - Math.sin(angle) * k * 3.8, r: 2 });
    }
    WORLD.clearings.push({ x: p.x + n.x * 16, z: p.z + n.z * 16, r: 26 });

  const instanced = function (geometry, material, painted) {
    const mesh = new THREE.InstancedMesh(geometry, material, crowd.length);

    head: instanced(head, makeMaterial('#ffffff'), true), inner: instanced(inner, fashionPaint(makeMaterial(first.inner), 'inner'), false),

    top.rotation.y = topSpot.turn;

      piece.visible = false;
      root.add(piece);
    });

  f.theme = null;
  setFashionTargets(c.start);
  f.blend = 1;
  applyFashionPaint(1);
  WORLD.resetters.push(function () {
    f.theme = null;
    f.cooldown = 0;
    setFashionTargets(c.start);
    f.blend = 0;
    f.boxes.forEach(function (box) { box.wait = 0; box.grow = 1; box.mesh.visible = true; });
    f.shardData.forEach(function (shard) { shard.life = 0; });
    Object.keys(f.clothes).forEach(function (name) {
      f.clothes[name].show = 0;
      f.clothes[name].pieces.forEach(function (piece) { piece.visible = false; });

// 테마의 목표 색을 정합니다. 실제 색은 updateFashion이 몇 초에 걸쳐 따라갑니다.
function setFashionTargets(name) {
  const f = WORLD.fashion, theme = CONFIG.fashion.themes[name];
  f.paints.forEach(function (paint) { paint.target.set(theme[paint.key]); });
  const tone = new THREE.Color();
  if (f.ground) {
    for (let t = 0; t < f.ground.ranks.length; t++) {
      tone.set(theme.ground[Math.floor(f.ground.ranks[t] * theme.ground.length)]);
      f.ground.target.set([tone.r, tone.g, tone.b, tone.r, tone.g, tone.b, tone.r, tone.g, tone.b], t * 9);
    }
  }
  f.crowd.people.forEach(function (person) {
    person.jacket.set(theme.crowd[Math.floor(person.rank * theme.crowd.length)]);
    person.face.set(theme.skin[Math.floor(person.skin * theme.skin.length)]);
  });
  f.blend = 0;
}
function applyFashionPaint(k) {
  const f = WORLD.fashion, tone = f.crowd.color;
  f.paints.forEach(function (paint) {
    paint.material.color.lerp(paint.target, k);
    if (paint.tint) paint.material.emissive.copy(paint.material.color);
  });
  if (f.ground) {
    const now = f.ground.attribute.array, target = f.ground.target;
    for (let i = 0; i < now.length; i++) now[i] += (target[i] - now[i]) * k;
    f.ground.attribute.needsUpdate = true;
  }
  const crowd = f.crowd;
  crowd.people.forEach(function (person, i) {
    crowd.body.getColorAt(i, tone);
    tone.lerp(person.jacket, k);
    crowd.body.setColorAt(i, tone);
    crowd.arms.setColorAt(i, tone);
    crowd.head.getColorAt(i, tone);
    tone.lerp(person.face, k);
    crowd.head.setColorAt(i, tone);
  });
  crowd.body.instanceColor.needsUpdate = true;
  crowd.arms.instanceColor.needsUpdate = true;
  crowd.head.instanceColor.needsUpdate = true;
}

function pickFashion(box) {
  const f = WORLD.fashion, c = CONFIG.fashion, theme = c.themes[box.name];
  box.wait = c.respawn;
  box.grow = 0;
  box.mesh.visible = false;
  f.cooldown = c.cooldown;
  const tone = new THREE.Color(theme.box.fill), edge = new THREE.Color(theme.box.edge);
  for (let i = 0; i < 18; i++) {
    const shard = f.shardData[f.shardIndex];
    f.shards.setColorAt(f.shardIndex, i % 3 ? tone : edge);
    f.shardIndex = (f.shardIndex + 1) % f.shardData.length;
    const angle = Math.random() * 6.28, speed = 5 + Math.random() * 11;
    Object.assign(shard, { life: 1.1, x: box.x, y: c.boxHeight, z: box.z, vx: Math.cos(angle) * speed, vy: 5 + Math.random() * 10, vz: Math.sin(angle) * speed, size: 0.35 + Math.random() * 0.6, spin: Math.random() * 6 });
  }
  f.shards.instanceColor.needsUpdate = true;
  if (f.theme !== box.name) {
    f.theme = box.name;
    setFashionTargets(box.name);
  }
  WORLD.swapCar(theme.ride, theme.flash);
}

function updateFashion(dt, s) {
  const f = WORLD.fashion, c = CONFIG.fashion;
  if (!f.crowd) return;
  f.time += dt;
  f.cooldown -= dt;
  // 박스: 천천히 돌며 떠 있고, 부서지면 잠시 뒤 다시 자랍니다.
  let hit = null, closest = c.boxRadius;
  f.boxes.forEach(function (box, index) {
    if (box.wait > 0) {
      box.wait -= dt;
      if (box.wait <= 0) box.mesh.visible = true;
      return;
    }
    box.grow += (1 - box.grow) * (1 - Math.exp(-7 * dt));
    box.mesh.scale.setScalar(Math.max(box.grow, 0.01));
    box.mesh.rotation.set(0.0, f.time * 0.9 + box.spin, 0.0);
    box.mesh.position.y = c.boxHeight + (f.calm ? 0 : Math.sin(f.time * 2 + index) * 0.22);
    const d = Math.hypot(box.x - s.x, box.z - s.z);
    if (d < closest) { closest = d; hit = box; }
  });
  if (hit && f.cooldown <= 0 && !WORLD.glitch.on) pickFashion(hit);

  const helper = f.helper;
  f.shardData.forEach(function (shard, i) {
    if (shard.life <= 0 && shard.y < -4) return;
    shard.life -= dt;
    shard.vy -= 26 * dt;
    shard.x += shard.vx * dt;
    shard.y += shard.vy * dt;
    shard.z += shard.vz * dt;
    if (shard.life <= 0) shard.y = -5;
    helper.position.set(shard.x, shard.y, shard.z);
    helper.rotation.set(shard.life * 7 + shard.spin, shard.life * 5, 0);
    helper.scale.setScalar(shard.size * Math.min(1, Math.max(shard.life, 0) * 3));
    helper.updateMatrix();
    f.shards.setMatrixAt(i, helper.matrix);
    f.shards.instanceMatrix.needsUpdate = true;
  });

  // 색 전환
  if (f.blend < 1) {
    f.blend = Math.min(1, f.blend + dt / 1.4);
    applyFashionPaint(f.blend >= 1 ? 1 : 1 - Math.exp(-5 * dt));
  }

  // 옷은 바닥에서 부풀어 오르듯 나타나고, 다른 테마를 고르면 납작해지며 사라집니다.
  Object.keys(f.clothes).forEach(function (name) {
    const item = f.clothes[name], goal = f.theme === name ? 1 : 0;
    if (item.show === goal) return;
    item.show += Math.sign(goal - item.show) * Math.min(Math.abs(goal - item.show), dt * 2.4);
    const t = item.show, pop = t * (1 + Math.sin(t * Math.PI) * 0.22);
    item.pieces.forEach(function (piece) {
      piece.visible = t > 0;
      piece.scale.set(Math.max(pop, 0.001), Math.max(t * t * (1 + Math.sin(t * Math.PI) * 0.8), 0.001), Math.max(pop, 0.001));
    });
  });

  // 관중: 차가 가까울 때만 계산합니다. 서로 다른 속도로 뛰며 환호합니다.
  const crowd = f.crowd;
  if (Math.hypot(s.x - f.centre.x, s.z - f.centre.z) > c.crowdReach) return;
  const excited = 0.55 + (f.theme ? 0.45 : 0), still = f.calm ? 0 : 1;
  crowd.people.forEach(function (person, i) {
    const hop = Math.abs(Math.sin(f.time * person.rate + person.phase)) * 0.5 * excited * still;
    helper.position.set(person.x, person.y + hop, person.z);
    helper.rotation.set(0, person.angle, 0);
    helper.scale.set(1, 1, 1);
    helper.updateMatrix();
    crowd.body.setMatrixAt(i, helper.matrix);
    crowd.head.setMatrixAt(i, helper.matrix);
    crowd.inner.setMatrixAt(i, helper.matrix);
    helper.position.y += 1.12;
    helper.scale.y = person.wave < 0.34 ? -0.9 : 0.55 + (0.5 + Math.sin(f.time * person.rate * 0.7 + person.phase) * 0.5) * 0.65 * still;
    helper.updateMatrix();
    crowd.arms.setMatrixAt(i, helper.matrix);
  });
  crowd.body.instanceMatrix.needsUpdate = true;
  crowd.head.instanceMatrix.needsUpdate = true;
  crowd.inner.instanceMatrix.needsUpdate = true;
  crowd.arms.instanceMatrix.needsUpdate = true;
}

/* ---------- 랩 구간: 내 키보드와 마우스가 트랙 옆의 거대한 키보드, 마우스와 그대로 연결됩니다 ---------- */
// 86키 배열. [글자, e.code, 폭(유닛), 앞의 빈칸(유닛), 빨간 키캡 여부]
function labRow(list) {
  return list.map(function (key) { return typeof key === 'string' ? [key, 'Key' + key] : key; });

// 한국어 키보드의 한/영, 한자 키는 오른쪽 Alt, Ctrl 키캡을 누릅니다.
const LAB_ALIAS = { Lang1: 'AltRight', Lang2: 'ControlRight', HangulMode: 'AltRight', Hanja: 'ControlRight', ContextMenu: 'ControlRight', MetaRight: 'MetaLeft' };

const LAB = {
  input: null, screen: null, note: null, noteDirty: false, noteBeat: 0, time: 0,
  active: false, near: false, caps: {}, all: [], pressed: {}, view: { viewX: 0, viewZ: 0 }, mouseX: 0, mouseZ: 0, goalX: 0, goalZ: 0, wheelAngle: 0, glow: null, x: 0, z: 0,

  enter: function () {
    this.active = true;
    this.near = false;
    WORLD.locked = true;
    Object.keys(input).forEach(function (name) { setInput(name, false); });
    document.body.classList.add('lab');
    // 숨겨 둔 입력칸이 글자를 받습니다. 한글 입력도 브라우저의 조합을 그대로 씁니다.
    this.input.focus({ preventScroll: true });
    this.screen.material.color.set('#ffffff');
    this.screen.material.map = this.note.texture;
    this.screen.material.needsUpdate = true;
    this.noteDirty = true;
    KEY_SOUND.prepare();
    const canvas = document.querySelector('a-scene').canvas;
    if (canvas && canvas.requestPointerLock) {
      const asked = canvas.requestPointerLock();
      if (asked && asked.catch) asked.catch(function () {});   // 잠금이 막힌 환경에서도 마우스 이동은 그대로 받습니다.
    }
  },
  exit: function () {
    if (!this.active) return;
    this.active = false;
    WORLD.locked = false;
    this.release();
    document.body.classList.remove('lab');
    this.input.blur();
    window.focus();
    this.screen.material.color.set('#050506');
    this.screen.material.map = null;
    this.screen.material.needsUpdate = true;
    if (document.pointerLockElement) document.exitPointerLock();
  },
  release: function () {
    Object.keys(this.pressed).forEach(function (code) { delete LAB.pressed[code]; });
    this.button(0, false);
    this.button(2, false);
  },
  // Esc는 키캡과 연결하지 않고 나가기 전용으로 씁니다.
  key: function (e, down) {
    if (e.code === 'Escape') {
      e.preventDefault();
      if (down) this.exit();
      return;
    }
    // 글자 입력과 복사, 붙여넣기, 되돌리기는 입력칸에 맡기고 브라우저 단축키만 막습니다.
    const edit = /^[acvxyz]$/i.test(e.key);
    if (/^F\d+$/.test(e.code) || ((e.ctrlKey || e.metaKey) && !edit)) e.preventDefault();
    if (e.code === 'Tab') {
      e.preventDefault();
      if (down) this.input.setRangeText('    ', this.input.selectionStart, this.input.selectionEnd, 'end');
      this.noteDirty = true;
    }
    const code = LAB_ALIAS[e.code] || e.code, cap = this.caps[code];
    if (!cap) return;
    if (down && !e.repeat) KEY_SOUND.play('down', cap.wide);
    if (!down) KEY_SOUND.play('up', cap.wide);
    if (down) this.pressed[code] = true;
    else delete this.pressed[code];
    // Print Screen은 브라우저가 떼는 신호만 보내므로 잠깐 눌렀다 뗍니다.
    if (!down && code === 'PrintScreen') this.caps[code].flash = 0.14;
  },
  move: function (dx, dy) {
    const c = CONFIG.lab;
    this.goalX = THREE.MathUtils.clamp(this.goalX + dx * c.mouseSpeed, -c.mouseX, c.mouseX);
    this.goalZ = THREE.MathUtils.clamp(this.goalZ + dy * c.mouseSpeed, -c.mouseZ, c.mouseZ);
  },
  button: function (index, down) {
    const plate = index === 0 ? this.leftButton : index === 2 ? this.rightButton : null;
    if (plate) plate.down = down;
    if (down && index === 0 && this.active) this.clickTab();
  },
  // 화면 속 포인터의 위치(0~1)
  pointer: function () {
    const c = CONFIG.lab;
    return [(this.mouseX / c.mouseX + 1) / 2, (this.mouseZ / c.mouseZ + 1) / 2];
  },
  // 포인터 아래에 있는 축 탭
  tabAt: function () {
    const c = CONFIG.switches, at = this.pointer(), w = this.note.canvas.width, x = at[0] * w, y = at[1] * this.note.canvas.height;
    if (y > 58) return null;
    const left = w - c.order.length * c.tabWidth - 12, index = Math.floor((x - left) / c.tabWidth);
    return c.order[index] || null;
  },
  clickTab: function () {
    const name = this.tabAt();
    if (!name) return;
    KEY_SOUND.choice = name;
    KEY_SOUND.play('down', false);
    this.noteDirty = true;
  },
  hint: function () {
    return { x: this.mouseWorldX, z: this.mouseWorldZ, ready: false, text: 'Esc를 눌러 나가기', action: '나가기' };
  }
};

// 글자 하나의 윤곽을 입체로 만듭니다. x는 글자의 왼쪽 시작 위치입니다.
function glyphShapes(char, x, scale) {
  const glyph = VOID_WORDS.glyphs[char], path = new THREE.ShapePath();
  const px = function (v) { return (x + v) * scale; }, py = function (v) { return v * scale; };
  glyph.d.split(' ').forEach(function (command) {
    const type = command[0], v = command.slice(1).split(',').map(Number);
    if (type === 'M') path.moveTo(px(v[0]), py(v[1]));
    if (type === 'L') path.lineTo(px(v[0]), py(v[1]));
    if (type === 'Q') path.quadraticCurveTo(px(v[0]), py(v[1]), px(v[2]), py(v[3]));
    if (type === 'C') path.bezierCurveTo(px(v[0]), py(v[1]), px(v[2]), py(v[3]), px(v[4]), py(v[5]));
  });
  return path.toShapes(false);
}
function extrudeShapes(shapes, width) {
  const depth = CONFIG.void.wordDepth, geometry = new THREE.ExtrudeGeometry(shapes, { depth: depth, bevelEnabled: false, curveSegments: 3 });
  geometry.translate(-width / 2, 0, -depth / 2);
  return geometry;
}
function letterGeometry(char) {
  const data = VOID_WORDS, scale = 1 / data.capHeight;
  return extrudeShapes(glyphShapes(char, 0, scale), data.glyphs[char].a * scale);
}

    Array.prototype.push.apply(shapes, glyphShapes(char, x, scale));
    letters.push({ char: char, offset: (x + data.glyphs[char].a / 2) * scale });
    x += data.glyphs[char].a + 24;

  return { geometry: extrudeShapes(shapes, width), width: width, letters: letters };
}
function buildWords(space, points, normals, samples, portal) {
  const c = CONFIG.void, g = WORLD.glitch, facing = Math.atan2(CONFIG.camera.offset[0], CONFIG.camera.offset[2]);
  const shapes = c.words.map(wordGeometry);
  const paints = c.wordColors.map(function (color) {
    return new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.62, roughness: 0.5, fog: false });
  });
  g.letterShapes = {};
  Object.keys(VOID_WORDS.glyphs).forEach(function (char) { g.letterShapes[char] = letterGeometry(char); });
  // 날아가는 글자는 미리 만들어 두고 돌려 씁니다.
  for (let i = 0; i < c.letterPool; i++) {
    const mesh = new THREE.Mesh(g.letterShapes.A, paints[0]);
    mesh.visible = false;
    space.add(mesh);
    g.letters.push({ mesh: mesh, state: 'off', x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, spinX: 0, spinY: 0, spinZ: 0, rx: 0, ry: 0, rz: 0, size: 1 });
  }
  let seed = 4242;
  const random = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  g.paints = paints;
  g.words = [];
  for (let i = 0; i < c.wordCount; i++) {
    const shape = shapes[i % shapes.length], height = c.wordMin + Math.pow(random(), 2.2) * (c.wordMax - c.wordMin);
    let x = 0, z = 0;
    for (let tries = 0; tries < 12; tries++) {
      const spot = Math.floor(random() * samples), roll = random();
      const side = roll < c.wordOnTrack ? (random() - 0.5) * 11 : (random() < 0.5 ? -1 : 1) * (10 + random() * 46);
      x = points[spot].x + normals[spot].x * side;
      z = points[spot].z + normals[spot].z * side;
      if (Math.hypot(x - portal.x, z - portal.z) > 26) break;
    }
    const mesh = new THREE.Mesh(shape.geometry, paints[Math.floor(random() * paints.length)]);
    mesh.scale.setScalar(height);
    space.add(mesh);
    g.words.push({
      mesh: mesh, x: x, z: z, ry: facing + (random() - 0.5) * 0.5, height: height, halfWidth: shape.width * height / 2, letters: shape.letters, jump: 0, standing: true

}
function resetWords() {
  const g = WORLD.glitch;
  g.words.forEach(function (word) {
    word.standing = true;
    word.jump = 0;
    word.mesh.visible = true;
    word.mesh.position.set(word.x, 0, word.z);
    word.mesh.rotation.set(0, word.ry, 0);
  });
  g.letters.forEach(function (letter) {
    letter.state = 'off';
    letter.mesh.visible = false;
  });
}
// 글자 하나를 날립니다. 맞은 곳에 가까운 글자일수록 세게, 작은 글자일수록 멀리 날아갑니다.
function launchLetter(letter, s, speed, power) {
  const c = CONFIG.void, light = c.wordKick / (1 + letter.size * 0.1), push = Math.max(speed, 5) * light * power;
  const dirX = speed > 1 ? s.vx / speed : letter.x - s.x, dirZ = speed > 1 ? s.vz / speed : letter.z - s.z, length = Math.hypot(dirX, dirZ) || 1;
  const angle = (Math.random() - 0.5) * c.letterSpread;
  letter.vx = (dirX / length * Math.cos(angle) - dirZ / length * Math.sin(angle)) * push;
  letter.vz = (dirZ / length * Math.cos(angle) + dirX / length * Math.sin(angle)) * push;
  letter.vy = 3 + Math.random() * 4 + speed * 0.42 * light * power;
  const twist = 2 + speed * 0.32;
  letter.spinX = (Math.random() - 0.5) * twist * 2;
  letter.spinY = (Math.random() - 0.5) * twist * 2;
  letter.spinZ = (Math.random() - 0.5) * twist * 2;
  letter.state = 'fly';
}
function breakWord(word, s, speed, hitAt) {
  const c = CONFIG.void, g = WORLD.glitch, cos = Math.cos(word.ry), sin = Math.sin(word.ry);
  word.standing = false;
  word.mesh.visible = false;
  word.letters.forEach(function (item) {
    const letter = g.letters[g.letterIndex], along = item.offset * word.height;
    g.letterIndex = (g.letterIndex + 1) % g.letters.length;
    letter.mesh.geometry = g.letterShapes[item.char];
    letter.mesh.material = word.mesh.material;
    letter.mesh.scale.setScalar(word.height);
    letter.mesh.visible = true;
    letter.size = word.height;
    letter.x = word.x + cos * along;
    letter.z = word.z - sin * along;
    letter.y = 0;
    letter.rx = 0;
    letter.ry = word.ry;
    letter.rz = 0;
    launchLetter(letter, s, speed, 1.3 - Math.min(Math.abs(along - hitAt) / (word.halfWidth + 1), 1) * 0.75);
  });
  s.vx *= 1 - c.wordDrag * word.height;
  s.vz *= 1 - c.wordDrag * word.height;
}
function updateWords(dt, s) {
  const c = CONFIG.void, g = WORLD.glitch, speed = Math.hypot(s.vx, s.vz);
  g.wordTimer -= dt;
  const flicker = g.wordTimer <= 0;
  if (flicker) g.wordTimer = 0.07;
  g.words.forEach(function (word) {
    if (!word.standing) return;
    const dx = s.x - word.x, dz = s.z - word.z;
    if (Math.abs(dx) < word.halfWidth + 6 && Math.abs(dz) < word.halfWidth + 6) {
      // 단어의 방향에 맞춘 좌표에서 차와 겹치는지 봅니다.
      const cos = Math.cos(word.ry), sin = Math.sin(word.ry), across = dx * cos - dz * sin, along = dx * sin + dz * cos;
      if (Math.abs(across) < word.halfWidth + 1.4 && Math.abs(along) < c.wordDepth * word.height / 2 + 2 && speed > 0.8) {
        breakWord(word, s, speed, across);
        return;
      }
    }
    if (flicker && Math.random() < c.wordFlicker) {
      // 서 있는 단어는 가끔 색이 바뀌며 옆으로 튑니다.
      word.mesh.material = g.paints[Math.floor(Math.random() * g.paints.length)];
      word.mesh.position.x = word.x + (Math.random() - 0.5) * 0.7;
      word.jump = 0.08;
    } else if (word.jump > 0) {
      word.jump -= dt;
      if (word.jump <= 0) word.mesh.position.x = word.x;
    }
  });
  g.letters.forEach(function (letter) {
    if (letter.state === 'off') return;
    // 바닥에 누운 글자도 다시 칠 수 있습니다.
    if (letter.state === 'rest') {
      if (speed > 0.8 && Math.hypot(s.x - letter.x, s.z - letter.z) < 1.8 + letter.size * 0.35) launchLetter(letter, s, speed, 0.8);
      return;
    }
    letter.vy -= c.wordGravity * dt;
    letter.x += letter.vx * dt;
    letter.y += letter.vy * dt;
    letter.z += letter.vz * dt;
    letter.rx += letter.spinX * dt;
    letter.ry += letter.spinY * dt;
    letter.rz += letter.spinZ * dt;
    if (letter.y <= 0) {
      // 땅에 닿으면 튀어 오르며 힘을 잃고, 충분히 느려지면 옆으로 눕습니다.
      letter.y = 0;
      letter.vy = -letter.vy * 0.4;
      letter.vx *= 0.66;
      letter.vz *= 0.66;
      letter.spinX *= 0.6;
      letter.spinY *= 0.6;
      letter.spinZ *= 0.6;
      if (Math.hypot(letter.vx, letter.vz) + letter.vy < 2.2) {
        letter.state = 'rest';
        letter.rx = -Math.PI / 2;
        letter.rz = 0;
        letter.y = c.wordDepth * letter.size / 2;
      }
    }
    letter.mesh.position.set(letter.x, letter.y, letter.z);
    letter.mesh.rotation.set(letter.rx, letter.ry, letter.rz);
  });
}

/* ---------- 글리치 구간 Void: 포털을 지나면 맵 전체가 검은 공간과 흰 트랙으로 바뀌고, 같은 포털로만 나갈 수 있습니다 ---------- */

// 맵 전체를 Void로 바꿉니다.
function enterVoid(car) {

// 원래 세계로 돌아옵니다. reveal이 켜져 있으면 포털을 중심으로 Void가 밀려나듯 원래 맵이 드러납니다.

// 트랙 밖에서 깨질 지점을 고릅니다. 흰 트랙 위에는 나타나지 않고, 한 지점에 조각이 뭉쳐 나타납니다.
function spawnTile(tile, s) {
  const c = CONFIG.void, g = WORLD.glitch;
  if (g.burst <= 0) {
    g.burst = 3 + Math.floor(Math.random() * 9);

      const x = s.x + (Math.random() - 0.5) * c.reach * 1.5, z = s.z + (Math.random() - 0.5) * c.reach * 1.5;
      g.centerX = x;
      g.centerZ = z;

      g.centerX = 9999;
    }
  }
  g.burst -= 1;
  const cell = c.cell, size = cell * c.sizes[Math.floor(Math.random() * c.sizes.length)];
  tile.x = Math.round((g.centerX + (Math.random() - 0.5) * c.cluster) / cell) * cell;
  tile.z = Math.round((g.centerZ + (Math.random() - 0.5) * c.cluster) / cell) * cell;
  tile.size = size;
  tile.life = c.lifeMin + Math.random() * Math.random() * (c.lifeMax - c.lifeMin);
  tile.step = 0;
  const roll = Math.random();
  if (roll < 0.55) {           // 공중에 뜬 얇은 판
    tile.height = 0.12;
    tile.y = 0.3 + Math.random() * c.maxHeight;
  } else {                     // 바닥에서 솟은 조각
    tile.height = 0.5 + Math.random() * c.maxHeight;
    tile.y = tile.height / 2;
  }
  const lean = roll < 0.55 ? 0.5 : 0;
  tile.tiltX = (Math.random() - 0.5) * lean;
  tile.tiltZ = (Math.random() - 0.5) * lean;
}
function updateTiles(dt, s) {
  const c = CONFIG.void, g = WORLD.glitch, helper = g.helper;
  g.tiles.forEach(function (tile, i) {
    if (tile.life <= 0) {
      tile.wait -= dt;
      if (tile.wait <= 0) {
        spawnTile(tile, s);
        tile.wait = Math.random() * c.gapMax;
        g.shards.setColorAt(i, voidColor());
        g.shards.instanceColor.needsUpdate = true;
      }
    }
    if (tile.life > 0) {
      tile.life -= dt;
      tile.step -= dt;
      // 부드럽게 움직이지 않고 짧은 간격으로 툭툭 튑니다.
      if (tile.step <= 0) {
        tile.step = 0.03 + Math.random() * 0.1;
        tile.jump = (Math.random() - 0.5) * 1.1;
      }
    }
    helper.position.set(tile.x, tile.life > 0 ? Math.max(tile.height / 2, tile.y + tile.jump) : -9, tile.z);
    helper.rotation.set(tile.tiltX, 0, tile.tiltZ);
    helper.scale.set(tile.size, tile.height, tile.size);
    helper.updateMatrix();
    g.shards.setMatrixAt(i, helper.matrix);
  });
  g.shards.instanceMatrix.needsUpdate = true;
}
function updatePortal(dt, s, car) {
  const c = CONFIG.void, g = WORLD.glitch, portal = g.portal;

    ctx.clearRect(0, 0, w, h);

        ctx.fillRect(Math.floor(Math.random() * w / 5) * 5, Math.floor(Math.random() * h / 5) * 5, size, size);
      }
    });
    ctx.globalAlpha = 1;

    const helper = g.helper;
    for (let i = 0; i < portal.bits.count; i++) {
      const edge = Math.random(), side = Math.random() < 0.4;
      helper.position.set(side ? (Math.random() < 0.5 ? -1 : 1) * c.portalWidth / 2 + (Math.random() - 0.5) * 3 : (edge - 0.5) * (c.portalWidth + 3), side ? edge * c.portalHeight : c.portalHeight + (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 1.6);

}
// 잔상: 차의 실제 속도로 움직이기 시작해 관성만 남기고 멈춥니다. 차가 앞서 나가므로 이동 방향의 반대쪽에 꼬리가 생기고,
// 후진하면 앞쪽으로, 빠를수록 길게, 느릴수록 짧게 남습니다. 미끄러질 때는 미끄러지는 방향을 따라 번집니다.

  const c = CONFIG.void, g = WORLD.glitch, ride = car.el.object3D, speed = Math.hypot(s.vx, s.vz);
  g.trail -= dt;
  g.trailRoad += speed * dt;

    ghost.opacity = (c.ghostOpacity[0] + Math.random() * (c.ghostOpacity[1] - c.ghostOpacity[0])) * (0.55 + rate * 0.45);
    ghost.vx = s.vx * c.trailCarry;
    ghost.vz = s.vz * c.trailCarry;
    ghost.mesh.position.set(ride.position.x, 0, ride.position.z);
    ghost.mesh.rotation.set(0, ride.rotation.y, 0);
    ghost.mesh.material.color.set(c.greens[Math.floor(Math.random() * c.greens.length)]);
    ghost.mesh.visible = true;
  }
  const slow = Math.exp(-c.trailDrag * dt);
  car.ghosts.forEach(function (ghost) {
    if (!ghost.mesh.visible) return;
    ghost.life -= dt;
    if (ghost.life <= 0) { ghost.mesh.visible = false; return; }
    ghost.vx *= slow;
    ghost.vz *= slow;
    ghost.mesh.position.x += ghost.vx * dt;
    ghost.mesh.position.z += ghost.vz * dt;
    ghost.mesh.material.opacity = ghost.opacity * ghost.life / ghost.total;
  });
}
function updateVoid(dt, s, car) {
  const c = CONFIG.void, g = WORLD.glitch;
  updatePortal(dt, s, car);
  updateTrail(dt, s, car);
  const camera = car.el.sceneEl.camera;
  // 포털을 지나면 원이 퍼지며 원래 맵이 드러납니다. 원 밖은 아직 Void입니다.
  if (g.out >= 0) {
    g.out = Math.min(1, g.out + dt / c.exitSeconds);
    car.cameraEl.object3D.updateMatrixWorld(true);
    const radius = c.exitStart + (INTRO.reach(camera) + 30 - c.exitStart) * g.out;
    if (g.out >= 1) {
      g.out = -1;
      document.getElementById('iris').hidden = true;
    } else {
      INTRO.draw(camera, radius, c.greens[0], g.track);
    }
  }
  if (!g.on) return;
  g.scan -= dt;
  if (g.scan <= 0) {
    g.scan = 0.25;
    g.near = g.track.filter(function (spot) { return Math.hypot(spot.point.x - s.x, spot.point.z - s.z) < c.reach; });
  }
  updateTiles(dt, s);
  updateWords(dt, s);
  // 들어오는 순간 화면이 초록 조각으로 깨졌다가 사라집니다.
  if (g.flash >= 0) {
    g.flash += dt / c.enterSeconds;
    const iris = document.getElementById('iris');
    if (g.flash >= 1) {
      g.flash = -1;
      iris.hidden = true;
    } else {
      iris.hidden = false;
      INTRO.scatter(1 - g.flash);
    }
  }
}

/* ---------- 트랙과 주변 환경 ---------- */
AFRAME.registerComponent('test-track', {
  init: function () {
    const c = CONFIG.color, f = CONFIG.faust, root = this.el.object3D;
    const curve = new THREE.CatmullRomCurve3([
      [70, 70], [0, 70], [-70, 70], [-115, 48], [-122, 0], [-98, -36], [-55, -28],
      [-28, -58], [15, -86], [72, -76], [116, -42], [165, -46], [212, -38], [238, 2], [224, 44], [172, 68], [112, 72]
    ].map(function (p) { return new THREE.Vector3(p[0], 0, p[1]); }), true, 'catmullrom', 0.5);
    const samples = 740, half = 7, kerb = 1.1;
    const points = curve.getSpacedPoints(samples);
    const normals = points.map(function (p, i) {
      const a = points[(i - 1 + samples) % samples], b = points[(i + 1) % samples];
      const t = new THREE.Vector3().subVectors(b, a).normalize();
      return new THREE.Vector3(t.z, 0, -t.x);
    });
    const distanceToTrack = function (x, z) {
      let best = Infinity;
      for (let i = 0; i < samples; i += 4) best = Math.min(best, Math.hypot(points[i].x - x, points[i].z - z));
      return best;
    };
    const stripe = function (from, to, y, color, every, phase, glow, where) {
      const positions = [];
      for (let i = 0; i < samples; i++) {
        if (every && (i % (every * 2) < every) !== phase) continue;
        const a = points[i], b = points[i + 1], na = normals[i], nb = normals[(i + 1) % samples];
        if (where && !where(a)) continue;
        const v = [
          a.x + na.x * from, y, a.z + na.z * from, a.x + na.x * to, y, a.z + na.z * to,
          b.x + nb.x * to, y, b.z + nb.z * to, b.x + nb.x * from, y, b.z + nb.z * from
        ];
        positions.push(v[0], v[1], v[2], v[3], v[4], v[5], v[6], v[7], v[8], v[0], v[1], v[2], v[6], v[7], v[8], v[9], v[10], v[11]);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const up = new Float32Array(positions.length);
      for (let i = 1; i < up.length; i += 3) up[i] = 1;
      geometry.setAttribute('normal', new THREE.BufferAttribute(up, 3));
      const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: glow || 0, roughness: 0.95, side: THREE.DoubleSide }));
      mesh.receiveShadow = true;
      root.add(mesh);
      return mesh;
    };

    // 바닥: 삼각형마다 팔레트의 색을 골라 로우폴리 땅을 만듭니다. 구간 경계도 삼각형을 따라 각지게 나뉩니다.
    const far = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.MeshStandardMaterial({ color: c.grass[0], roughness: 1 }));
    far.rotation.x = -Math.PI / 2;
    far.position.y = -0.05;
    root.add(far);
    const cell = 6, extent = WORLD.bounds + 12, positions = [], colors = [], tone = new THREE.Color();
    const fashionPositions = [], fashionRanks = [];
    const hash = function (a, b) { const v = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return v - Math.floor(v); };
    const addTriangle = function (ax, az, bx, bz, cx, cz) {
      const mx = (ax + bx + cx) / 3, mz = (az + bz + cz) / 3;
      const zone = zoneAt(mx, mz);
      if (zone === 'fashion') {
        fashionPositions.push(ax, 0, az, bx, 0, bz, cx, 0, cz);
        fashionRanks.push(hash(mx, mz));
        return;
      }
      const palette = zone === 'faust' ? f.ground : zone === 'music' ? CONFIG.music.ground : c.grass;
      tone.set(palette[Math.floor(hash(mx, mz) * palette.length)]);
      positions.push(ax, 0, az, bx, 0, bz, cx, 0, cz);
      for (let i = 0; i < 3; i++) colors.push(tone.r, tone.g, tone.b);
    };
    for (let x = -extent; x < WORLD.east + 12; x += cell) {
      for (let z = -extent; z < extent; z += cell) {
        addTriangle(x, z, x, z + cell, x + cell, z);
        addTriangle(x + cell, z, x, z + cell, x + cell, z + cell);
      }
    }
    const groundGeometry = new THREE.BufferGeometry();
    groundGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    groundGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    groundGeometry.computeVertexNormals();
    const ground = new THREE.Mesh(groundGeometry, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true }));
    ground.receiveShadow = true;
    root.add(ground);
    // 패션 구간의 바닥은 테마에 따라 색이 바뀌므로 따로 만듭니다.
    const fashionGeometry = new THREE.BufferGeometry();
    fashionGeometry.setAttribute('position', new THREE.Float32BufferAttribute(fashionPositions, 3));
    fashionGeometry.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(fashionPositions.length), 3));
    fashionGeometry.computeVertexNormals();
    const fashionGround = new THREE.Mesh(fashionGeometry, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true }));
    fashionGround.receiveShadow = true;
    root.add(fashionGround);
    WORLD.fashion.ground = { attribute: fashionGeometry.attributes.color, ranks: fashionRanks, target: new Float32Array(fashionPositions.length) };

    // 트랙: 아스팔트는 전 구간 같고, 연석 색만 구간에 따라 달라집니다.
    const stage = function (p) { return zoneAt(p.x, p.z) === 'music'; };
    const runway = function (p) { return zoneAt(p.x, p.z) === 'fashion'; };
    stripe(-half, half, 0.03, c.track, 0, false, 0, function (p) { return !stage(p) && !runway(p); });
    fashionPaint(stripe(-half, half, 0.03, c.track, 0, false, 0, runway).material, 'track');
    stripe(-half, half, 0.03, CONFIG.music.track, 0, false, 0, stage);
    stripe(-0.12, 0.12, 0.05, c.trackLine, 5, true);
    const outside = function (p) { return !zoneAt(p.x, p.z); };
    const inside = function (p) { return zoneAt(p.x, p.z) === 'faust'; };
    const onStage = function (p) { return zoneAt(p.x, p.z) === 'music'; };
    [[-half - kerb, -half], [half, half + kerb]].forEach(function (edge) {
      stripe(edge[0], edge[1], 0.04, c.kerbA, 2, true, 0.3, outside);
      stripe(edge[0], edge[1], 0.04, c.kerbB, 2, false, 0.15, outside);
      stripe(edge[0], edge[1], 0.04, f.kerbA, 2, true, 0.3, inside);
      stripe(edge[0], edge[1], 0.04, f.kerbB, 2, false, 0.15, inside);
      stripe(edge[0], edge[1], 0.04, CONFIG.music.kerbA, 2, true, 0.15, onStage);
      stripe(edge[0], edge[1], 0.04, CONFIG.music.kerbB, 2, false, 0, onStage);
      fashionPaint(stripe(edge[0], edge[1], 0.04, c.kerbA, 2, true, 0.3, runway).material, 'kerbA');
      fashionPaint(stripe(edge[0], edge[1], 0.04, c.kerbB, 2, false, 0.15, runway).material, 'kerbB');
    });

    // 출발선과 게이트
    const black = makeMaterial(c.carbon), white = makeMaterial(c.kerbA), lamp = makeMaterial(c.lamp), gate = makeMaterial(c.gate);
    for (let row = 0; row < 2; row++) {
      for (let i = 0; i < 14; i++) {
        const tile = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), (row + i) % 2 ? white : black);
        tile.rotation.x = -Math.PI / 2;
        tile.position.set(11.5 + row, 0.06, 63.5 + i);
        root.add(tile);
      }
    }
    addBox(0.6, 7, 0.6, gate, root, 12, 3.5, 60.5);
    addBox(0.6, 7, 0.6, gate, root, 12, 3.5, 79.5);
    addBox(0.4, 0.5, 19.6, gate, root, 12, 7, 70);
    for (let i = 0; i < 5; i++) addBox(0.2, 0.36, 0.36, lamp, root, 11.7, 7, 66 + i * 2);
    WORLD.statics.push({ x: 12, z: 60.5, r: 0.5 }, { x: 12, z: 79.5, r: 0.5 });

    // 파우스트 구간
    buildFaust(root, points, normals, samples);
    buildRoadText(root);

    // 노래 구간
    buildMusic(root, points, normals, samples);

    // 패션 구간과 글리치 구간
    buildFashion(root, points, normals, samples);
    buildVoid(root, stripe, points, normals, samples, half);
    buildLab(root);

    // 나무와 바위: 구간에 따라 색이 달라지는 고정 충돌체
    let seed = 2023;
    const random = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const treeGeo = new THREE.IcosahedronGeometry(1, 0), trunkGeo = new THREE.CylinderGeometry(0.35, 0.5, 1, 6);
    const crownMats = c.tree.map(function (color) { return makeMaterial(color); });
    const faustCrownMats = f.tree.map(function (color) { return makeMaterial(color); });
    const musicCrownMats = CONFIG.music.tree.map(function (color) { return makeMaterial(color); });
    const musicRockMat = makeMaterial(CONFIG.music.rock), musicTrunkMat = makeMaterial(CONFIG.music.deck);
    const fashionCrown = fashionPaint(makeMaterial(c.tree[1]), 'tree'), fashionRock = fashionPaint(makeMaterial(c.rock), 'rock'), fashionTrunk = fashionPaint(makeMaterial(c.trunk), 'trunk');
    const trunkMat = makeMaterial(c.trunk), rockMat = makeMaterial(c.rock), faustRockMat = makeMaterial(f.rock);
    const blocked = function (x, z) {
      return Math.hypot(x, z - 42) < 16 || (x > -116 && x < -30 && z > 12 && z < 62) ||
        WORLD.clearings.some(function (c) { return Math.hypot(c.x - x, c.z - z) < c.r; });
    };
    for (let i = 0; i < 280; i++) {
      // 앞의 190개는 원래 지도 전체에, 나머지는 동쪽으로 넓힌 땅에 놓습니다.
      const x = i < 190 ? (random() - 0.5) * 310 : 150 + random() * 108, z = (random() - 0.5) * 310;
      const roll = random(), size = 1.4 + random() * 2.2, pick = random();
      if (distanceToTrack(x, z) < half + 8 || blocked(x, z)) continue;
      const zone = zoneAt(x, z);
      if (roll < 0.72) {
        const mats = zone === 'fashion' ? [fashionCrown] : zone === 'faust' ? faustCrownMats : zone === 'music' ? musicCrownMats : crownMats;
        addMesh(trunkGeo, zone === 'fashion' ? fashionTrunk : zone === 'music' ? musicTrunkMat : trunkMat, root, x, 0.8, z).scale.set(1, 1.6, 1);
        const crown = addMesh(treeGeo, mats[Math.floor(pick * mats.length)], root, x, 1.5 + size, z);
        crown.scale.set(size * 0.9, size * 1.4, size * 0.9);
        crown.rotation.y = random() * 6;
        WORLD.statics.push({ x: x, z: z, r: 0.7 });
      } else {
        const rock = addMesh(treeGeo, zone === 'fashion' ? fashionRock : zone === 'faust' ? faustRockMat : zone === 'music' ? musicRockMat : rockMat, root, x, size * 0.28, z);
        rock.scale.set(size * 0.8, size * 0.5, size * 0.7);
        rock.rotation.set(random(), random() * 6, random());
        WORLD.statics.push({ x: x, z: z, r: size * 0.65 });
      }
    }

    // 외곽 울타리
    const fence = makeMaterial(c.fence), b = WORLD.bounds + 2;
    const eastEnd = WORLD.east + 2, middle = (eastEnd - b) / 2, wide = eastEnd + b;
    addBox(wide, 1.4, 1, fence, root, middle, 0.7, -b);
    addBox(wide, 1.4, 1, fence, root, middle, 0.7, b);
    addBox(1, 1.4, b * 2, fence, root, -b, 0.7, 0);
    addBox(1, 1.4, b * 2, fence, root, eastEnd, 0.7, 0);

    // 밀리는 물체
    const addProp = function (object, x, z, baseY, r, mass, y) {
      object.position.set(x, baseY + y, z);
      root.add(object);
      WORLD.props.push({ obj: object, x: x, z: z, y: y, baseY: baseY, r: r, mass: mass, vx: 0, vz: 0, vy: 0, spinX: 0, spinZ: 0, asleep: true, home: [x, z, y] });
    };
    const coneMat = makeMaterial(c.cone), coneBand = makeMaterial(c.crateAlt);
    const makeCone = function () {
      const group = new THREE.Group();
      addBox(0.9, 0.08, 0.9, coneMat, group, 0, -0.52, 0);
      addMesh(new THREE.ConeGeometry(0.4, 1.05, 8), coneMat, group, 0, 0, 0);
      addMesh(new THREE.CylinderGeometry(0.15, 0.24, 0.2, 8), coneBand, group, 0, 0.1, 0);
      return group;
    };
    for (let i = 0; i < 7; i++) addProp(makeCone(), 40 - i * 8, 70 + (i % 2 ? 3.2 : -3.2), 0.56, 0.5, 0.5, 0);
    const crateA = makeMaterial(c.crate), crateB = makeMaterial(c.crateAlt);
    const crateGeo = new THREE.BoxGeometry(1.3, 1.3, 1.3);
    [4, 3, 2, 1].forEach(function (count, layer) {
      for (let i = 0; i < count; i++) {
        const crate = new THREE.Group();
        addMesh(crateGeo, (layer + i) % 2 ? crateA : crateB, crate);
        addProp(crate, (i - (count - 1) / 2) * 1.4 - 2, 49, 0.65, 0.7, 1.2, layer * 1.3);
      }
    });

    WORLD.resetters.push(function () {
      WORLD.props.forEach(function (p) {
        p.x = p.home[0]; p.z = p.home[1]; p.y = p.home[2];
        p.vx = p.vz = p.vy = p.spinX = p.spinZ = 0;
        p.asleep = true;
        p.obj.rotation.set(0, 0, 0);
        p.obj.position.set(p.x, p.y + p.baseY, p.z);
      });
    });
  }
});

<body>

  <a-entity test-track></a-entity>

<script>
  document.querySelectorAll('.key').forEach(function (key) {
    const name = key.dataset.input;
    key.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (INTRO.state === 'title') { INTRO.begin(); return; }
      if (WORLD.console.active) { consoleInput(name, true); return; }
      if (WORLD.locked) return;
      if (key.setPointerCapture) key.setPointerCapture(e.pointerId);
      setInput(name, true);
      beginDriving();
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (type) {
      key.addEventListener(type, function () {
        if (WORLD.console.active) consoleInput(name, false);
        else setInput(name, false);
      });
    });
  });
  document.getElementById('fuelPrompt').addEventListener('click', function () { WORLD.startFuel(); });
  document.getElementById('consoleExit').addEventListener('click', exitConsole);
  document.getElementById('pickerClose').addEventListener('click', closePicker);
  document.getElementById('miniPrev').addEventListener('click', function () { stepSong(-1); });
  document.getElementById('miniNext').addEventListener('click', function () { stepSong(1); });
  document.getElementById('miniToggle').addEventListener('click', toggleSong);
  const volume = document.getElementById('miniVolume');
  volume.addEventListener('input', function () { AUDIO.setVolume(Number(volume.value)); });
  volume.addEventListener('change', function () { volume.blur(); });
  // 버튼을 눌러도 포커스를 가져가지 않아 스페이스바가 급브레이크로 계속 작동합니다.
  document.querySelectorAll('.miniButton').forEach(function (button) {
    button.addEventListener('pointerdown', function (e) { e.preventDefault(); });
  });
  window.addEventListener('pointerdown', function () { window.focus(); INTRO.begin(); });
</script>
